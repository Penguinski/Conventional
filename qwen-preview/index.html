<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe1">
  <title>CONVENTIONAL · Volume 1 — Condominio Interattivo</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/scenes.css">
  <link rel="stylesheet" href="css/content-ui.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <button id="logoBtn" aria-label="Home">
    <span class="sq"></span>
    <span>CONVENTIONAL</span>
    <span class="chip">VOL.1</span>
  </button>
  <div class="hud-right">
    <button id="btnLift" aria-label="Chiama ascensore">ASCENSORE</button>
    <div id="floorTag">PIANO 0</div>
  </div>
</div>

<!-- CONTEXT TAG -->
<div id="tag"></div>

<!-- HINT -->
<div id="hint">Tocca gli oggetti per esplorare</div>

<!-- STAGE -->
<div id="stage">

  <!-- SCENA 0: ANDRONE -->
  <div id="scene-androne" class="scene is-active" data-scene="androne">
    <div class="room">
      <div class="wall"></div>
      <div class="floorband"></div>
      
      <!-- Porta ingresso -->
      <div class="obj o-door hit" data-action="micro" data-id="porta-ingresso">
        <svg viewBox="0 0 120 200" class="st">
          <rect x="5" y="5" width="110" height="190" fill="#e9dcc2" class="st"/>
          <line x1="60" y1="10" x2="60" y2="195" class="st thin"/>
          <circle cx="95" cy="100" r="4" fill="#c08a52" class="st"/>
        </svg>
      </div>

      <!-- Tappetino -->
      <div class="obj o-mat0">
        <svg viewBox="0 0 100 40" class="st">
          <ellipse cx="50" cy="20" rx="45" ry="15" fill="#d9694b" class="st"/>
        </svg>
      </div>

      <!-- Ombrelli -->
      <div class="obj o-umb hit" data-action="micro" data-id="ombrelli">
        <svg viewBox="0 0 60 120" class="st">
          <path d="M30 5 Q50 30 50 60 L50 100 M30 5 Q10 30 10 60 L10 100" fill="none" class="st"/>
          <rect x="27" y="5" width="6" height="95" fill="#3f6358" class="st"/>
        </svg>
      </div>

      <!-- Citofono -->
      <div class="obj o-cito hit" data-action="micro" data-id="citofono">
        <svg viewBox="0 0 50 80" class="st">
          <rect x="5" y="5" width="40" height="70" fill="#9fb9c6" class="st"/>
          <circle cx="25" cy="30" r="8" fill="#e9b44c" class="st"/>
          <rect x="15" y="50" width="20" height="15" fill="#d9694b" class="st"/>
        </svg>
      </div>

      <!-- Cassette postali -->
      <div class="obj o-mail hit" data-action="micro" data-id="cassette">
        <svg viewBox="0 0 200 120" class="st">
          <rect x="5" y="5" width="190" height="110" fill="#7e9e6b" class="st"/>
          <line x1="65" y1="5" x2="65" y2="115" class="st thin"/>
          <line x1="125" y1="5" x2="125" y2="115" class="st thin"/>
          <rect x="20" y="40" width="30" height="8" fill="#e9b44c" class="st"/>
          <rect x="80" y="40" width="30" height="8" fill="#e9b44c" class="st"/>
          <rect x="140" y="40" width="30" height="8" fill="#e9b44c" class="st"/>
          <rect class="letter" x="25" y="20" width="20" height="12" fill="#f6efe1" class="st"/>
        </svg>
      </div>

      <!-- Bacheca -->
      <div class="obj o-board hit" data-action="reader" data-content="liti-condominiali" data-title="Liti Condominiali">
        <svg viewBox="0 0 140 100" class="st">
          <rect x="5" y="5" width="130" height="90" fill="#e9b44c" class="st"/>
          <rect x="10" y="15" width="55" height="35" fill="#f6efe1" class="st pp"/>
          <rect x="70" y="15" width="55" height="35" fill="#f6efe1" class="st pp"/>
          <rect x="40" y="55" width="55" height="35" fill="#f6efe1" class="st pp"/>
        </svg>
      </div>

      <!-- Ascensore (esterno) -->
      <div class="obj o-lift">
        <div class="lift-sign" id="liftSign0">0</div>
        <div class="lift-call hit" data-action="callLift" data-id="pulsante-ascensore">
          <svg viewBox="0 0 30 50" class="st">
            <rect x="3" y="3" width="24" height="44" fill="#e9b44c" class="st"/>
            <circle cx="15" cy="25" r="8" fill="#d9694b" class="st"/>
          </svg>
        </div>
        <div class="lift-frame">
          <div class="lift-leaf ll"><svg viewBox="0 0 100 200" class="st"><rect width="100" height="200" fill="#e3cfa4" class="st"/></svg></div>
          <div class="lift-leaf lr"><svg viewBox="0 0 100 200" class="st"><rect width="100" height="200" fill="#e3cfa4" class="st"/></svg></div>
        </div>
      </div>

      <!-- Pianta -->
      <div class="obj o-plant hit" data-action="micro" data-id="pianta-androne">
        <svg viewBox="0 0 80 120" class="st sway">
          <rect x="35" y="80" width="10" height="40" fill="#d9694b" class="st"/>
          <ellipse cx="40" cy="50" rx="35" ry="40" fill="#7e9e6b" class="st"/>
        </svg>
      </div>

      <!-- Bicicletta -->
      <div class="obj o-bike hit" data-action="micro" data-id="bicicletta">
        <svg viewBox="0 0 120 80" class="st" style="transform: rotate(-4deg);">
          <circle cx="30" cy="50" r="20" fill="none" class="st"/>
          <circle cx="90" cy="50" r="20" fill="none" class="st"/>
          <path d="M30 50 L50 20 L80 50 M50 20 L65 35" fill="none" class="st"/>
        </svg>
      </div>

      <!-- Lampada soffitto -->
      <div class="obj o-lamp0">
        <svg viewBox="0 0 60 60" class="st lampswing">
          <line x1="30" y1="0" x2="30" y2="20" class="st thin"/>
          <path d="M20 20 Q30 40 40 20 Z" fill="#e9b44c" class="st"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- SCENA 1: CABINA ASCENSORE -->
  <div id="scene-cabin" class="scene" data-scene="cabin">
    <div class="room">
      <div class="cab-ceil"></div>
      <div class="wall"></div>
      <div class="floorband"></div>
      <div class="cab-seam"></div>
      
      <!-- Pulsantiera -->
      <div class="obj o-panel hit" data-action="liftPanel" data-id="pulsantiera">
        <svg viewBox="0 0 80 200" class="st">
          <rect x="5" y="5" width="70" height="190" fill="#9fb9c6" class="st"/>
          <circle class="lift-btn" cx="40" cy="40" r="12" fill="#e9b44c" data-floor="3" class="st"/>
          <circle class="lift-btn" cx="40" cy="80" r="12" fill="#e9b44c" data-floor="2" class="st"/>
          <circle class="lift-btn" cx="40" cy="120" r="12" fill="#e9b44c" data-floor="1" class="st"/>
          <circle class="lift-btn" cx="40" cy="160" r="12" fill="#e9b44c" data-floor="0" class="st"/>
        </svg>
      </div>
      
      <!-- Display piano -->
      <div class="obj o-display">
        <svg viewBox="0 0 60 40" class="st">
          <rect x="5" y="5" width="50" height="30" fill="#23201c" class="st"/>
          <text x="30" y="28" text-anchor="middle" fill="#e9b44c" font-size="20" font-weight="bold" id="cabinFloorDisplay">0</text>
        </svg>
      </div>
    </div>
  </div>

  <!-- SCENA 2: PIANEROTTOLO PIANO 1 -->
  <div id="scene-landing1" class="scene" data-scene="landing" data-floor="1">
    <div class="room">
      <div class="wall"></div>
      <div class="floorband"></div>
      
      <!-- Indicatore piano -->
      <div class="obj o-floor-num">
        <svg viewBox="0 0 60 60" class="st">
          <circle cx="30" cy="30" r="25" fill="#e9b44c" class="st"/>
          <text x="30" y="38" text-anchor="middle" font-weight="bold" font-size="28" class="st txt">1</text>
        </svg>
      </div>
      
      <!-- Porta A -->
      <div class="obj o-doorA hit doorhit" data-action="enterApartment" data-apt="1A">
        <svg viewBox="0 0 100 180" class="st">
          <rect x="5" y="5" width="90" height="170" fill="#d9694b" class="st"/>
          <rect x="15" y="15" width="70" height="150" fill="#c05539" class="st"/>
          <circle cx="75" cy="90" r="5" fill="#e9b44c" class="st"/>
          <rect x="20" y="155" width="60" height="10" fill="#f6efe1" class="st"/>
          <text x="50" y="163" text-anchor="middle" font-size="8" font-weight="bold">1A</text>
        </svg>
      </div>
      
      <!-- Porta B -->
      <div class="obj o-doorB hit doorhit" data-action="enterApartment" data-apt="1B">
        <svg viewBox="0 0 100 180" class="st">
          <rect x="5" y="5" width="90" height="170" fill="#3f6358" class="st"/>
          <rect x="15" y="15" width="70" height="150" fill="#2d4a42" class="st"/>
          <circle cx="25" cy="90" r="5" fill="#e9b44c" class="st"/>
          <rect x="20" y="155" width="60" height="10" fill="#f6efe1" class="st"/>
          <text x="50" y="163" text-anchor="middle" font-size="8" font-weight="bold">1B</text>
        </svg>
      </div>
      
      <!-- Zerbinio -->
      <div class="obj o-mat1">
        <svg viewBox="0 0 80 30" class="st">
          <ellipse cx="40" cy="15" rx="35" ry="12" fill="#7e9e6b" class="st"/>
        </svg>
      </div>
      
      <!-- Pacco -->
      <div class="obj o-package hit" data-action="micro" data-id="pacco-piano1">
        <svg viewBox="0 0 50 50" class="st">
          <rect x="5" y="10" width="40" height="35" fill="#c08a52" class="st"/>
          <line x1="25" y1="10" x2="25" y2="45" class="st thin"/>
          <line x1="5" y1="27" x2="45" y2="27" class="st thin"/>
        </svg>
      </div>
      
      <!-- Scarpe -->
      <div class="obj o-shoes hit" data-action="micro" data-id="scarpe-piano1">
        <svg viewBox="0 0 70 40" class="st">
          <path d="M10 20 Q15 10 25 15 L30 35 L15 35 Z" fill="#23201c" class="st"/>
          <path d="M40 20 Q45 10 55 15 L60 35 L45 35 Z" fill="#23201c" class="st"/>
        </svg>
      </div>
      
      <!-- Pianta pianerottolo -->
      <div class="obj o-plant1 hit" data-action="micro" data-id="pianta-piano1">
        <svg viewBox="0 0 60 80" class="st sway">
          <rect x="25" y="50" width="10" height="30" fill="#d9694b" class="st"/>
          <circle cx="30" cy="35" r="20" fill="#7e9e6b" class="st"/>
        </svg>
      </div>
      
      <!-- Interruttore luce -->
      <div class="obj o-switch hit" data-action="micro" data-id="interruttore-piano1">
        <svg viewBox="0 0 30 40" class="st">
          <rect x="5" y="5" width="20" height="30" fill="#9fb9c6" class="st"/>
          <circle cx="15" cy="20" r="6" fill="#e9b44c" class="st"/>
        </svg>
      </div>
      
      <!-- Scale -->
      <div class="obj o-stairs">
        <svg viewBox="0 0 100 150" class="st">
          <rect x="10" y="120" width="80" height="20" fill="#c08a52" class="st"/>
          <rect x="10" y="90" width="80" height="20" fill="#c08a52" class="st"/>
          <rect x="10" y="60" width="80" height="20" fill="#c08a52" class="st"/>
          <rect x="10" y="30" width="80" height="20" fill="#c08a52" class="st"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- SCENA 3: APPARTAMENTO 1A (ARTURO) -->
  <div id="scene-apt1A" class="scene" data-scene="apartment" data-apt="1A">
    <div class="room">
      <div class="wall"></div>
      <div class="floorband"></div>
      <div class="baseboard"></div>
      
      <!-- Finestra -->
      <div class="obj o-window hit" data-action="micro" data-id="finestra-1A">
        <svg viewBox="0 0 120 140" class="st">
          <rect x="5" y="5" width="110" height="130" fill="#9fb9c6" class="st"/>
          <line x1="60" y1="5" x2="60" y2="135" class="st thin"/>
          <line x1="5" y1="70" x2="115" y2="70" class="st thin"/>
        </svg>
      </div>
      
      <!-- Divano -->
      <div class="obj o-sofa hit" data-action="micro" data-id="divano-1A">
        <svg viewBox="0 0 140 80" class="st">
          <rect x="5" y="20" width="130" height="55" fill="#d9694b" class="st"/>
          <rect x="10" y="10" width="40" height="30" fill="#c05539" class="st"/>
          <rect x="90" y="10" width="40" height="30" fill="#c05539" class="st"/>
        </svg>
      </div>
      
      <!-- Tavolo con tastiera -->
      <div class="obj o-desk hit" data-action="micro" data-id="scrivania-1A">
        <svg viewBox="0 0 100 70" class="st">
          <rect x="10" y="30" width="80" height="35" fill="#c08a52" class="st"/>
          <rect x="15" y="15" width="70" height="20" fill="#23201c" class="st"/>
          <rect x="20" y="20" width="60" height="10" fill="#4d4740" class="st"/>
        </svg>
      </div>
      
      <!-- Robot aspirapolvere -->
      <div class="obj o-robot hit" data-action="micro" data-id="robot-1A">
        <svg viewBox="0 0 60 60" class="st">
          <circle cx="30" cy="30" r="25" fill="#23201c" class="st"/>
          <circle cx="30" cy="30" r="10" fill="#e9b44c" class="st"/>
        </svg>
      </div>
      
      <!-- Cane Ugo -->
      <div class="obj o-dog hit" data-action="micro" data-id="cane-1A">
        <svg viewBox="0 0 80 50" class="st">
          <ellipse cx="40" cy="30" rx="30" ry="18" fill="#7e9e6b" class="st"/>
          <circle cx="60" cy="25" r="10" fill="#7e9e6b" class="st"/>
          <circle cx="65" cy="22" r="3" fill="#23201c"/>
        </svg>
      </div>
      
      <!-- Ciabatte Grinch -->
      <div class="obj o-slippers hit" data-action="micro" data-id="ciabatte-1A">
        <svg viewBox="0 0 70 40" class="st">
          <path d="M10 25 Q15 10 30 15 L35 35 L15 35 Z" fill="#7e9e6b" class="st"/>
          <path d="M40 25 Q45 10 60 15 L65 35 L45 35 Z" fill="#7e9e6b" class="st"/>
        </svg>
      </div>
      
      <!-- Mazza minigolf + pallina -->
      <div class="obj o-minigolf hit" data-action="micro" data-id="minigolf-1A">
        <svg viewBox="0 0 100 60" class="st">
          <line x1="10" y1="40" x2="70" y2="20" class="st thin"/>
          <circle cx="80" cy="15" r="6" fill="#d9694b" class="st"/>
        </svg>
      </div>
      
      <!-- Sedia con vestiti -->
      <div class="obj o-chair hit" data-action="micro" data-id="sedia-1A">
        <svg viewBox="0 0 60 90" class="st">
          <rect x="15" y="40" width="30" height="45" fill="#c08a52" class="st"/>
          <rect x="10" y="20" width="40" height="30" fill="#d9694b" class="st"/>
          <path d="M15 25 L25 15 L35 25 L45 15 L55 25" fill="none" class="st thin"/>
        </svg>
      </div>
      
      <!-- Frigo -->
      <div class="obj o-fridge hit" data-action="micro" data-id="frigo-1A">
        <svg viewBox="0 0 70 120" class="st">
          <rect x="5" y="5" width="60" height="110" fill="#9fb9c6" class="st"/>
          <line x1="5" y1="50" x2="65" y2="50" class="st thin"/>
          <rect x="50" y="25" width="8" height="15" fill="#23201c" class="st"/>
          <rect x="50" y="70" width="8" height="15" fill="#23201c" class="st"/>
        </svg>
      </div>
      
      <!-- Lampada terra -->
      <div class="obj o-lamp1">
        <svg viewBox="0 0 50 120" class="st lampswing">
          <line x1="25" y1="0" x2="25" y2="60" class="st thin"/>
          <path d="M15 60 Q25 80 35 60 Z" fill="#e9b44c" class="st"/>
        </svg>
      </div>
      
      <!-- Navigazione interna: zone -->
      <div class="apt-nav">
        <button class="apt-nav-btn" data-zone="0" aria-label="Zona 1">●</button>
        <button class="apt-nav-btn" data-zone="1" aria-label="Zona 2">●</button>
        <button class="apt-nav-btn" data-zone="2" aria-label="Zona 3">●</button>
      </div>
      
      <!-- Back button -->
      <button class="back-btn hit" data-action="backToLanding" aria-label="Torna al pianerottolo">← Esci</button>
    </div>
  </div>

</div>

<!-- CONTENT OVERLAYS -->

<!-- Bottom Sheet (short content) -->
<div id="bottomSheet" class="content-overlay" role="dialog" aria-modal="true" hidden>
  <div class="overlay-backdrop"></div>
  <div class="bottom-sheet-content">
    <button class="close-btn" aria-label="Chiudi">✕</button>
    <h2 id="bottomSheetTitle"></h2>
    <div id="bottomSheetBody"></div>
  </div>
</div>

<!-- Long Form Reader -->
<div id="readerOverlay" class="content-overlay full-screen" role="dialog" aria-modal="true" hidden>
  <div class="reader-header">
    <button class="back-btn hit" aria-label="Torna indietro">← Indietro</button>
    <div class="reader-meta">
      <span id="readerReadingTime"></span>
    </div>
  </div>
  <article class="reader-content">
    <h1 id="readerTitle"></h1>
    <div id="readerBody"></div>
  </article>
</div>

<!-- Full Screen Experience -->
<div id="experienceOverlay" class="content-overlay full-screen" role="dialog" aria-modal="true" hidden>
  <div class="experience-header">
    <button class="back-btn hit" aria-label="Torna al condominio">✕ Esci</button>
    <h2 id="experienceTitle"></h2>
  </div>
  <div id="experienceContent" class="experience-body"></div>
</div>

<!-- Quiz Overlay -->
<div id="quizOverlay" class="content-overlay full-screen" role="dialog" aria-modal="true" hidden>
  <div class="quiz-header">
    <button class="back-btn hit" aria-label="Torna al condominio">✕ Esci</button>
    <h2>Che inquilino sei?</h2>
  </div>
  <div class="quiz-body">
    <div id="quizIntro">
      <p class="quiz-intro-text">Un test non scientifico per scoprire come vivi, come convivi e quanto sei sopportabile quando attraversi la porta di casa.</p>
      <button class="quiz-start-btn" id="quizStartBtn">Inizia il quiz</button>
    </div>
    <div id="quizContainer" hidden>
      <div class="progress-wrapper">
        <div class="progress-text">Domanda <span id="currentQuestion">1</span> di <span id="totalQuestions">0</span></div>
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      </div>
      <div id="questions"></div>
    </div>
    <div id="quizResult" hidden>
      <div class="result-label">Il tuo risultato è</div>
      <h2 id="resultTitle"></h2>
      <p id="resultDescription"></p>
      <button class="quiz-restart-btn" id="quizRestartBtn">Rifai il quiz</button>
    </div>
  </div>
</div>

<!-- Elevator Game Overlay -->
<div id="elevatorGameOverlay" class="content-overlay full-screen" role="dialog" aria-modal="true" hidden>
  <div class="experience-header">
    <button class="back-btn hit" aria-label="Torna al condominio">✕ Esci</button>
    <h2>Ascensore Sociale</h2>
  </div>
  <div id="elevatorGameContent" class="experience-body"></div>
</div>

<script type="module" src="js/data.js"></script>
<script type="module" src="js/state.js"></script>
<script type="module" src="js/content-router.js"></script>
<script type="module" src="js/interactions.js"></script>
<script type="module" src="js/elevator.js"></script>
<script type="module" src="js/quiz.js"></script>
<script type="module" src="js/elevator-game.js"></script>
<script type="module" src="js/main.js"></script>

</body>
</html>
