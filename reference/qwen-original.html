<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CONVENTIONAL · Volume 1 — Bozza visiva</title>

<!-- ============================================================
CONVENTIONAL · VOL.1 — BOZZA VISIVA INTERATTIVA (UX + Art Direction)

STRUTTURA DELLE 4 SCENE
 1. ANDRONE (piano 0) ─ portone, cassette postali, citofono,
    bacheca, porta dell'ascensore, pianta, bicicletta, ombrelli.
 2. CABINA ASCENSORE ─ pulsantiera 4·3·2·1·0·-1 (funziona solo 1),
    porte che si chiudono, corsa vibrata, riapertura sul pianerottolo.
 3. PIANEROTTOLO (piano 1) ─ porte A/B, zerbini diversi, pacco,
    pianta, scarpe, numero del piano, luce scale, scale di scorcio.
 4. APPARTAMENTO A ─ soggiorno/cucina con divano, tavolo, sedia con
    vestiti, frigo, finestra, mobiletto. Interattivi: frigo, sedia, soffitto.

PALETTE (piatta, nessuna sfumatura)
  inchiostro #23201c · carta #f6efe1 · sabbia #e9dcc2
  terracotta #d9694b · senape #e9b44c · verde scala #3f6358
  foglia #7e9e6b · legno #c08a52 · cielo #9fb9c6

REGOLE D'ILLUSTRAZIONE
  - campiture piene + contorno nero uniforme (~3px, non-scaling)
  - geometrie semplici, leggermente storte (rotate -2°/+2°)
  - ombre solo come ellipse piatte al 10% d'inchiostro
  - ogni oggetto è un piccolo SVG indipendente appoggiato nella scena

PATTERN CLICCABILE vs DECORATIVO
  - cliccabile (.hit): al hover si solleva di pochi px, proietta
    un'ombra piatta, appare una piccola etichetta contestuale;
    il senape segnala gli snodi funzionali (ascensore, pulsante 1).
  - decorativo: fermo, cursore normale, al massimo un dondolio d'ambiente.
============================================================ -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/archivo@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/archivo@latest/latin-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/archivo@latest/latin-800-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/fraunces@latest/latin-600-italic.css">

<style>
/* ============ BASE ============ */
:root{
  --ink:#23201c; --paper:#f6efe1; --sand:#e9dcc2; --sand-d:#dccaa8;
  --clay:#d9694b; --clay-d:#c05539; --mustard:#e9b44c; --mustard-d:#d9a13a;
  --teal:#3f6358; --leaf:#7e9e6b; --wood:#c08a52; --sky:#9fb9c6;
  --cab:#e3cfa4; --charcoal:#4d4740;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  overflow:hidden; background:var(--paper); color:var(--ink);
  font-family:'Archivo',system-ui,sans-serif;
  -webkit-user-select:none; user-select:none;
}
svg{display:block}
svg text{font-family:'Archivo',sans-serif; user-select:none}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

.st{stroke:var(--ink);stroke-width:3;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.thin{stroke-width:2}
.fat{stroke-width:6}
.txt{font-weight:800;fill:var(--ink)}

/* ============ TOPBAR ============ */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;justify-content:space-between;align-items:center;
  padding:16px clamp(14px,2.4vw,28px);pointer-events:none;
}
#topbar > *{pointer-events:auto}
#logoBtn{display:flex;align-items:center;gap:10px;letter-spacing:.2em;font-weight:800;font-size:clamp(13px,1.5vw,17px)}
#logoBtn .sq{width:12px;height:12px;background:var(--clay);border:3px solid var(--ink);transform:rotate(6deg);transition:transform .3s}
#logoBtn:hover .sq{transform:rotate(96deg)}
#logoBtn .chip{font-size:.62em;letter-spacing:.14em;background:var(--ink);color:var(--paper);padding:3px 7px;transform:rotate(-2deg)}
.hud-right{display:flex;align-items:center;gap:10px}
#btnLift{
  font-size:12px;font-weight:700;letter-spacing:.1em;
  border:3px solid var(--ink);background:var(--paper);padding:6px 11px;
  box-shadow:3px 4px 0 rgba(35,32,28,.15);
  opacity:0;pointer-events:none;transform:translateY(-4px);transition:.3s;
}
#btnLift.show{opacity:1;pointer-events:auto;transform:none}
#btnLift:hover{background:var(--mustard)}
#floorTag{
  border:3px solid var(--ink);background:var(--paper);
  padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.16em;
  box-shadow:3px 4px 0 rgba(35,32,28,.15);transition:opacity .18s, transform .18s;
}
#floorTag.sw{opacity:0;transform:translateY(-5px)}

/* ============ STAGE / SCENE ============ */
#stage{position:fixed;inset:0}
.scene{
  position:absolute;inset:0;overflow:hidden;
  opacity:0;visibility:hidden;pointer-events:none;
  transform:scale(.985);
  transition:opacity .5s ease,transform .5s ease,visibility 0s linear .5s;
}
.scene.is-active{opacity:1;visibility:visible;pointer-events:auto;transform:scale(1);transition:opacity .5s ease,transform .5s ease}
.room{position:absolute;inset:0}
.wall{position:absolute;inset:0}
.floorband{position:absolute;left:0;right:0;bottom:0;height:16%;border-top:3.5px solid var(--ink)}
.baseboard{position:absolute;left:0;right:0;bottom:16%;height:9px;background:var(--sand-d);border-top:3px solid var(--ink);z-index:0}

.obj{position:absolute}
.obj svg{width:100%;height:auto;overflow:visible}

.hit{cursor:pointer;--hov:-4px;transition:transform .28s cubic-bezier(.2,.9,.3,1.4),filter .28s}
.hit:hover,.hit:focus-visible{transform:translateY(var(--hov));filter:drop-shadow(6px 8px 0 rgba(35,32,28,.16))}
.hit:focus-visible{outline:3px dashed var(--ink);outline-offset:5px}
.doorhit{--hov:-2px}

/* etichetta contestuale */
#tag{
  position:fixed;z-index:60;pointer-events:none;
  background:var(--paper);border:3px solid var(--ink);
  padding:.4em .75em;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  transform:translate(-50%,-112%) rotate(-2deg) scale(.85);opacity:0;
  transition:opacity .2s,transform .2s;white-space:nowrap;
  box-shadow:3px 4px 0 rgba(35,32,28,.16);
}
#tag.show{opacity:1;transform:translate(-50%,-112%) rotate(-2deg) scale(1)}

/* hint iniziale */
#hint{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:45;
  font-size:12px;letter-spacing:.14em;font-weight:600;opacity:.55;
  animation:hintpulse 3s ease-in-out infinite;transition:opacity .6s;pointer-events:none;
}
#hint.gone{opacity:0}
@keyframes hintpulse{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}

/* ============ ANIMAZIONI D'AMBIENTE ============ */
.sway{animation:sway 5.5s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.lampswing{animation:lampswing 4.5s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes lampswing{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
@keyframes nudge{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.nudge{animation:nudge .4s ease}
@keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.shake{animation:shakeX .3s ease 2}

/* =================================================
   SCENA 1 · ANDRONE
================================================= */
#scene-androne .wall{background:var(--sand)}
#scene-androne .floorband{background:var(--sand-d)}
#scene-androne .floorband::after{content:'';position:absolute;top:0;bottom:0;left:0;right:0;
  background:repeating-linear-gradient(90deg,transparent 0 118px,rgba(35,32,28,.10) 118px 121px)}
.o-door{left:2.5%;bottom:11.5%;width:clamp(148px,15vw,222px);z-index:2}
.o-mat0{left:3.5%;bottom:6%;width:clamp(88px,9vw,138px);z-index:3;transform:rotate(1deg)}
.o-umb{left:19%;bottom:11.5%;width:clamp(52px,5.4vw,78px);z-index:2}
.o-cito{left:25.5%;bottom:42%;width:clamp(46px,4.8vw,70px);z-index:2}
.o-mail{left:31.5%;bottom:36%;width:clamp(168px,19vw,258px);z-index:2}
.o-board{left:54%;bottom:46%;width:clamp(108px,12vw,162px);z-index:2;transform:rotate(.6deg)}
.o-lift{right:14.5%;bottom:10.5%;width:clamp(168px,19vw,266px);height:clamp(252px,56vh,420px);z-index:2}
.o-plant{right:1.2%;bottom:9.5%;width:clamp(108px,12vw,168px);z-index:3}
.o-bike{left:36%;bottom:6.5%;width:clamp(148px,17vw,232px);z-index:4;transform:rotate(-4deg)}
.o-lamp0{left:46.5%;top:-6px;width:clamp(44px,4.6vw,60px);z-index:2}

/* bacheca: fogli */
.pp{transform-box:fill-box;transform-origin:50% 8%;transition:transform .5s cubic-bezier(.3,1.4,.4,1)}
.o-board.shuffle .pp:nth-child(odd){transform:rotate(4deg)}
.o-board.shuffle .pp:nth-child(even){transform:rotate(-4deg) translateY(2px)}
/* posta */
.letter{transform-box:fill-box;transition:transform .45s cubic-bezier(.3,1.6,.4,1)}
.o-mail.pop .letter{transform:translateY(-11px) rotate(-9deg)}

/* ============ ASCENSORE (componente androne/landing) ============ */
.lift{position:absolute}
.lift .arch{position:absolute;inset:-16px -14px 0;background:var(--mustard);border:3.5px solid var(--ink)}
.lift-frame{
  position:absolute;inset:0;border:4px solid var(--ink);background:var(--cab);overflow:hidden;
}
.lift-peek,.lift-peek svg{position:absolute;inset:0;width:100%;height:100%}
.lift-leaf{position:absolute;top:0;bottom:0;width:50.6%;transition:transform .85s cubic-bezier(.72,.03,.24,1)}
.lift-leaf.ll{left:0}
.lift-leaf.lr{right:0}
.lift-leaf.lr svg{transform:scaleX(-1)}
.lift-leaf svg{width:100%;height:100%}
.lift.open .ll{transform:translateX(-102%)}
.lift.open .lr{transform:translateX(102%)}
.lift-sign{
  position:absolute;top:-44px;left:50%;transform:translateX(-50%);z-index:3;
  width:36px;height:36px;border:3.5px solid var(--ink);border-radius:50%;
  background:var(--paper);display:grid;place-items:center;font-weight:800;font-size:16px;
}
.lift-call{position:absolute;right:-32px;top:42%;width:27px;z-index:3}

/* =================================================
   SCENA 2 · CABINA
================================================= */
#scene-cabin .wall{background:var(--cab)}
#scene-cabin .floorband{background:var(--charcoal);height:13%}
.cab-ceil{position:absolute;top:0;left:0;right:0;height:9%;background:#d8c49a;border-bottom:3.5px solid var(--ink)}
.cab-seam{position:absolute;top:9%;bottom:13%;width:3px;background:rgba(35,32,28,.12)}
.rail{position:absolute;top:56%;height:11px;background:var(--ink);border-radius:8px}
.rail.rl{left:3%;width:22%}
.rail.rr{right:3%;width:22%}
.cab-mirror{left:6%;top:19%;width:clamp(56px,6.5vw,92px);z-index:1}

.doorway{
  position:absolute;left:50%;top:13.5%;transform:translateX(-50%);
  width:clamp(220px,30vw,396px);height:69%;
  border:4px solid var(--ink);background:var(--cab);overflow:hidden;z-index:2;
}
.doorway .arch2{position:absolute;inset:-18px -16px 0;background:var(--mustard);border:3.5px solid var(--ink);z-index:-1}
.dpeek,.dpeek svg{position:absolute;inset:0;width:100%;height:100%}
.dpeek svg{opacity:0;transition:opacity .35s}
.dpeek[data-show="lobby"] .pk-lobby{opacity:1}
.dpeek[data-show="land"] .pk-land{opacity:1}
.dleaf{position:absolute;top:0;bottom:0;width:50.6%;transition:transform .95s cubic-bezier(.72,.03,.24,1)}
.dleaf.dl{left:0}.dleaf.dr{right:0}
.dleaf.dr svg{transform:scaleX(-1)}
.dleaf svg{width:100%;height:100%}
.doorway.open .dl{transform:translateX(-102%)}
.doorway.open .dr{transform:translateX(102%)}

.cab-ind{
  position:absolute;top:4.5%;left:50%;transform:translateX(-50%);z-index:3;
  display:flex;align-items:center;gap:7px;
  background:var(--ink);color:var(--mustard);border:3px solid var(--ink);
  padding:5px 12px;font-weight:800;font-size:clamp(15px,1.8vw,20px);letter-spacing:.1em;
}
.cab-arrow{width:13px;height:13px;fill:var(--mustard);opacity:0}
#scene-cabin.run .cab-arrow{opacity:1;animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.cab-lamp{left:50%;top:-4px;transform:translateX(-50%);width:clamp(52px,5.5vw,72px);z-index:2}
.cab-lamp .bulb{transition:fill .2s}
#scene-cabin.ding .cab-lamp .bulb{fill:#fff6d8}
#scene-cabin.run .room{animation:vibr .28s linear infinite}
@keyframes vibr{0%,100%{transform:translateY(0)}30%{transform:translateY(2.5px)}65%{transform:translateY(-2px)}}
#scene-cabin.run .cab-lamp svg{animation:lampswing .5s ease-in-out infinite alternate}

.panel-wrap{right:5%;top:50%;transform:translateY(-50%);width:clamp(84px,9vw,118px);z-index:3}
.btn{cursor:pointer}
.btn circle{transform-box:fill-box;transform-origin:center;transition:transform .18s cubic-bezier(.3,1.6,.4,1),fill .18s}
.btn:hover circle{transform:scale(1.09)}
.btn.pressed circle{fill:var(--mustard);transform:scale(.94)}
.btn.deny circle{animation:shakeX .3s ease 2}
#panelBell.deny path{animation:shakeX .3s ease 2}

/* =================================================
   SCENA 3 · PIANEROTTOLO
================================================= */
#scene-landing .wall{background:#efe4cd;transition:background .5s}
#scene-landing .floorband{background:var(--sand-d)}
#scene-landing.lights-off .wall{background:#c9bb9c}
#scene-landing.lights-off .glow{opacity:0}
#scene-landing.lights-off .lift-sign{background:var(--sand-d)}
.l-lift{left:3.5%;bottom:10.5%;width:clamp(160px,18vw,250px);height:clamp(248px,54vh,408px);z-index:2}
.l-stairs{right:-1.5%;bottom:13%;width:clamp(140px,15vw,208px);z-index:1}
.l-plate{left:26.5%;bottom:55%;width:clamp(56px,6vw,84px);z-index:2;transform:rotate(-2deg)}
.l-doorA{left:33%;bottom:11.5%;width:clamp(150px,16vw,220px);z-index:2}
.l-doorB{left:56%;bottom:11.5%;width:clamp(150px,16vw,220px);z-index:2}
.l-matA{left:34.5%;bottom:5.5%;width:clamp(88px,10vw,138px);z-index:3}
.l-matB{left:57.5%;bottom:5.5%;width:clamp(88px,10vw,138px);z-index:3;transform:rotate(-1.4deg)}
.l-pacco{left:52.7%;bottom:8.5%;width:clamp(70px,7.6vw,106px);z-index:4;transform:rotate(3deg)}
.l-shoes{left:30%;bottom:6.5%;width:clamp(58px,6.4vw,88px);z-index:3}
.l-plant{left:76%;bottom:10.5%;width:clamp(78px,8.6vw,118px);z-index:3}
.l-lampC{left:46.8%;top:-4px;width:clamp(46px,4.8vw,64px);z-index:2}
.l-win{left:25.5%;bottom:63%;width:clamp(64px,7vw,96px);z-index:1;transform:rotate(1deg)}

/* porta A: apertura */
.leafA,.glowin{transform-box:fill-box}
.glowin{opacity:0;transition:opacity .4s}
.l-doorA.open .glowin{opacity:1}
.leafA{transform-origin:left center;transition:transform .55s cubic-bezier(.4,0,.3,1)}
.l-doorA.open .leafA{transform:translateX(-5%) scaleX(.6) skewY(-3deg)}

/* =================================================
   SCENA 4 · APPARTAMENTO
================================================= */
#scene-apartment .wall{background:#f2e3cf}
#scene-apartment .floorband{background:var(--wood);height:17%}
#scene-apartment .floorband::after{content:'';position:absolute;top:0;bottom:0;left:0;right:0;
  background:repeating-linear-gradient(90deg,transparent 0 96px,rgba(35,32,28,.12) 96px 99px)}
#scene-apartment .ceilband{position:absolute;top:0;left:0;right:0;height:8%;background:#eadbc0;border-bottom:3px solid var(--ink)}
#scene-apartment.rumore .room{animation:quake .55s ease}
@keyframes quake{0%,100%{transform:translateY(0)}20%{transform:translateY(3px)}45%{transform:translateY(-3px)}70%{transform:translateY(2px)}}
.a-window{left:5%;bottom:42%;width:clamp(168px,19vw,258px);z-index:1}
.a-frame{left:27.5%;bottom:58%;width:clamp(50px,5.4vw,74px);z-index:1;transform:rotate(-1.6deg)}
.a-rug{left:27%;bottom:5%;width:clamp(228px,27vw,384px);z-index:1}
.a-sofa{left:10%;bottom:10.5%;width:clamp(208px,23vw,328px);z-index:3}
.a-table{left:42%;bottom:11.5%;width:clamp(118px,13vw,178px);z-index:3}
.a-chair{left:56.5%;bottom:11%;width:clamp(96px,10.6vw,142px);z-index:4}
.a-cab{left:69%;bottom:11.5%;width:clamp(126px,14vw,188px);z-index:2}
.a-fridge{right:2%;bottom:11.5%;width:clamp(118px,13vw,178px);z-index:3}
.a-lamp{left:47.5%;top:-4px;width:clamp(46px,4.8vw,64px);z-index:2}
#ceilHit{position:absolute;top:0;left:0;right:0;height:16%;z-index:6}

.pile{transform-box:fill-box;transform-origin:50% 90%}
.a-chair.wob .pile{animation:nudge .5s ease 2}
.fdoor,.fin{transform-box:fill-box}
.fdoor{transform-origin:left center;transition:transform .5s cubic-bezier(.4,0,.3,1)}
.a-fridge.open .fdoor{transform:translateX(-5%) scaleX(.62) skewY(-2.5deg)}
.fin{opacity:0;transition:opacity .35s}
.a-fridge.open .fin{opacity:1}

/* fumetto sedia */
#bubble{
  position:absolute;left:51%;bottom:52%;z-index:7;max-width:238px;
  background:var(--paper);border:3px solid var(--ink);border-radius:14px;
  padding:12px 15px;font-weight:600;font-size:clamp(12px,1.3vw,14.5px);line-height:1.4;
  opacity:0;transform:translateY(10px) scale(.94);transition:.3s cubic-bezier(.3,1.3,.4,1);
  pointer-events:none;box-shadow:5px 6px 0 rgba(35,32,28,.15);
}
#bubble.show{opacity:1;transform:translateY(0) scale(1)}
#bubble::after{content:'';position:absolute;left:26px;bottom:-9px;width:14px;height:14px;
  background:var(--paper);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}

/* rumori del soffitto */
#thuds{position:absolute;inset:0;z-index:6;pointer-events:none}
.tw{position:absolute;font-weight:800;font-size:clamp(14px,1.7vw,21px);letter-spacing:.05em;animation:tw 1.35s ease forwards}
@keyframes tw{0%{opacity:0;transform:translateY(8px) rotate(-3deg)}18%{opacity:1}100%{opacity:0;transform:translateY(-18px) rotate(2deg)}}
.dust{position:absolute;width:5px;height:5px;background:var(--ink);border-radius:50%;opacity:.7;animation:fall 1.1s ease-in forwards}
@keyframes fall{to{transform:translateY(70px);opacity:0}}
#ceilNote{
  position:absolute;top:17%;left:50%;transform:translateX(-50%) rotate(-1deg);z-index:6;
  font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:clamp(13px,1.5vw,17px);
  background:var(--paper);border:3px solid var(--ink);padding:7px 14px;
  opacity:0;transition:opacity .4s;pointer-events:none;box-shadow:4px 5px 0 rgba(35,32,28,.14);white-space:nowrap;
}
#ceilNote.show{opacity:1}

/* ============ CARD EDITORIALE (frigo) ============ */
#card{
  position:fixed;z-index:55;right:clamp(14px,4vw,56px);top:50%;
  width:min(322px,86vw);background:var(--paper);border:3.5px solid var(--ink);
  box-shadow:9px 10px 0 rgba(35,32,28,.16);padding:20px 22px 22px;
  opacity:0;pointer-events:none;
  transform:translateY(-46%) rotate(-1.2deg) scale(.96);
  transition:opacity .35s,transform .35s cubic-bezier(.3,1.3,.4,1);
}
#card.show{opacity:1;pointer-events:auto;transform:translateY(-50%) rotate(-1.2deg) scale(1)}
#card .kicker{font-size:10.5px;font-weight:700;letter-spacing:.22em;margin-bottom:10px}
#card h3{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:clamp(21px,2.2vw,26px);line-height:1.2;margin:10px 0 14px}
#card .foot{font-size:11px;letter-spacing:.14em;font-weight:700;opacity:.55}
#cardClose{
  position:absolute;top:-14px;right:-14px;width:34px;height:34px;border-radius:50%;
  border:3px solid var(--ink);background:var(--clay);color:var(--paper);
  font-size:17px;font-weight:800;line-height:1;display:grid;place-items:center;
  transition:transform .2s;box-shadow:2px 3px 0 rgba(35,32,28,.2);
}
#cardClose:hover{transform:rotate(90deg)}

/* ============ RESPONSIVE ============ */
@media (max-width:820px){
  #topbar{padding:12px 12px}
  #logoBtn{letter-spacing:.14em}
  /* androne */
  .o-door{left:1.5%;width:33vw}
  .o-mat0{left:3%;width:24vw}
  .o-umb{left:36%;width:11vw}
  .o-cito{left:26%;bottom:56%;width:10vw}
  .o-mail{left:44%;bottom:44%;width:44vw}
  .o-board{left:6%;bottom:60%;width:24vw}
  .o-lift{right:2%;width:35vw;height:50vh}
  .o-plant{right:0;bottom:5%;width:18vw;z-index:5}

<script>
/* ============ STATO ============ */
let current='androne', busy=false, cabFloor=0, thudBusy=false, bubbleTimer=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

const floorTag=$('#floorTag'), btnLift=$('#btnLift'), tagEl=$('#tag'), hint=$('#hint');
const liftLobby=$('#liftLobby'), liftLand=$('#liftLand');
const cab=$('#scene-cabin'), cabDoor=$('#cabDoor'), cabNum=$('#cabNum'), cabPeek=$('#cabPeek');
const landing=$('#scene-landing'), apt=$('#scene-apartment');
const doorA=$('#doorA'), fridgeWrap=$('#fridgeWrap'), card=$('#card');
const bubble=$('#bubble'), thuds=$('#thuds'), ceilNote=$('#ceilNote');

/* ============ AIUTO ============ */
function go(name){
  if(current===name) return;
  document.getElementById('scene-'+current).classList.remove('is-active');
  current=name;
  document.getElementById('scene-'+name).classList.add('is-active');
  hideTag();
}
function setTag(t){
  floorTag.classList.add('sw');
  setTimeout(()=>{ floorTag.textContent=t; floorTag.classList.remove('sw'); },190);
}
function setPeek(v){ cabPeek.dataset.show=v; }
function hideTag(){ tagEl.classList.remove('show'); }
function dismissHint(){ hint.classList.add('gone'); }
setTimeout(dismissHint,7000);
addEventListener('pointerdown',dismissHint,{once:true});

/* ============ ETICHETTE AL HOVER ============ */
document.addEventListener('mouseover',e=>{
  const h=e.target.closest('.hit');
  if(h && h.dataset.tag && !busy){
    const r=h.getBoundingClientRect();
    tagEl.textContent=h.dataset.tag;
    tagEl.style.left=(r.left+r.width/2)+'px';
    tagEl.style.top=Math.max(46,r.top-4)+'px';
    tagEl.classList.add('show');
  }
});
document.addEventListener('mouseout',e=>{ if(e.target.closest('.hit')) hideTag(); });

/* ============ TASTIERA SUI PUNTI VIVI ============ */
$$('.hit').forEach(el=>{
  el.tabIndex=0; el.setAttribute('role','button');
  el.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.click(); }
  });
});

/* ============ ANDRONE → ASCENSORE ============ */
function enterCabin(from){
  if(busy) return; busy=true; hideTag();
  const lift=(from==='androne')?liftLobby:liftLand;
  lift.classList.add('open');
  setTimeout(()=>{
    cabFloor=(from==='androne')?0:1;
    cabNum.textContent=cabFloor;
    setPeek(from==='androne'?'lobby':'land');
    cabDoor.classList.add('open');
    go('cabin');
    setTag(cabFloor===0?'PIANO 0':'PIANO 1');
    setTimeout(()=>cabDoor.classList.remove('open'),750);   // le porte si chiudono alle spalle
    setTimeout(()=>{ busy=false; },1950);
  },820);
}
liftLobby.addEventListener('click',()=>enterCabin('androne'));
liftLand.addEventListener('click',()=>enterCabin('landing'));

/* ============ PULSANTIERA ============ */
function deny(btn){
  btn.classList.add('deny');
  setTimeout(()=>btn.classList.remove('deny'),620);
  const prev=cabNum.textContent;
  cabNum.textContent='—';
  setTimeout(()=>{ cabNum.textContent=(busy?'· · ·':prev); },480);
}
$$('.btn[data-n]').forEach(b=>{
  b.addEventListener('click',ev=>{
    ev.stopPropagation();
    if(busy) return;
    if(b.dataset.n==='1'){ travel(b); } else { deny(b); }
  });
});
$('#panelBell').addEventListener('click',ev=>{ ev.stopPropagation(); if(!busy) deny($('#panelBell')); });

/* ============ CORSA DELL'ASCENSORE ============ */
function travel(btn1){
  busy=true; hideTag();
  btn1.classList.add('pressed');
  cab.classList.add('run');
  setTag('· · ·');
  if(cabFloor===0){ setTimeout(()=>{ if(busy) cabNum.textContent='↑'; },430); }
  setTimeout(()=>{
    cab.classList.remove('run');
    cabNum.textContent='1';
    cab.classList.add('ding');
    setTimeout(()=>cab.classList.remove('ding'),420);
  },1900);
  setTimeout(()=>{ setPeek('land'); cabDoor.classList.add('open'); },2380);
  setTimeout(()=>{
    go('landing'); setTag('PIANO 1');
    liftLand.classList.add('open');                 // le porte si riaprono sul pianerottolo
    setTimeout(()=>liftLand.classList.remove('open'),950);
    setTimeout(()=>{ liftLand.classList.remove('open'); btn1.classList.remove('pressed'); busy=false; },1900);
  },3520);
}

/* ============ PIANEROTTOLO → APPARTAMENTO ============ */
doorA.addEventListener('click',()=>{
  if(busy) return; busy=true; hideTag();
  doorA.classList.add('open');
  setTimeout(()=>{
    go('apartment');
    setTag('PIANO 1 · INT. A');
    btnLift.classList.add('show');
    setTimeout(()=>{ doorA.classList.remove('open'); busy=false; },650);
  },600);
});
$('#doorB').addEventListener('click',function(){
  this.classList.remove('nudge'); void this.offsetWidth; this.classList.add('nudge');
});
btnLift.addEventListener('click',()=>{
  if(busy) return;
  closeCard(); fridgeWrap.classList.remove('open'); hideBubble();
  btnLift.classList.remove('show');
  go('landing'); setTag('PIANO 1');
});

/* ============ MICRO-INTERAZIONI ANDRONE ============ */
$('#mail').addEventListener('click',function(){
  this.classList.toggle('pop');
});
$('#cito').addEventListener('click',function(){
  this.classList.remove('shake'); void this.offsetWidth; this.classList.add('shake');
  const dots=$('#citoBtns').children;
  const d=dots[Math.floor(Math.random()*dots.length)];
  d.setAttribute('fill','var(--mustard)');
  setTimeout(()=>d.setAttribute('fill','var(--sand)'),700);
});
$('#board').addEventListener('click',function(){
  this.classList.add('shuffle');
  setTimeout(()=>this.classList.remove('shuffle'),700);
});
$('#portone').addEventListener('click',function(){
  this.classList.remove('nudge'); void this.offsetWidth; this.classList.add('nudge');
});
/* luce scale */
$('#landLamp').addEventListener('click',()=>landing.classList.toggle('lights-off'));

/* ============ APPARTAMENTO · FRIGO ============ */
fridgeWrap.addEventListener('click',()=>{
  const open=fridgeWrap.classList.toggle('open');
  if(open){ card.classList.add('show'); } else { closeCard(); }
});
$('#cardClose').addEventListener('click',e=>{ e.stopPropagation(); closeCard(); fridgeWrap.classList.remove('open'); });
function closeCard(){ card.classList.remove('show'); }

/* ============ APPARTAMENTO · SEDIA ============ */
$('#chairHit').addEventListener('click',function(){
  this.classList.remove('wob'); void this.offsetWidth; this.classList.add('wob');
  const on=bubble.classList.toggle('show');
  clearTimeout(bubbleTimer);
  if(on) bubbleTimer=setTimeout(hideBubble,4600);
});
function hideBubble(){ bubble.classList.remove('show'); }

/* ============ APPARTAMENTO · SOFFITTO (rumore del vicino) ============ */
$('#ceilHit').addEventListener('click',()=>{
  if(thudBusy || current!=='apartment') return;
  thudBusy=true; hideTag();
  apt.classList.add('rumore');
  const lampArt=$('#aptLamp svg');
  lampArt.style.animation='lampswing .32s ease-in-out 5 alternate';
  setTimeout(()=>{ lampArt.style.animation=''; apt.classList.remove('rumore'); },1000);
  ['tump','tump','tump.'].forEach((w,i)=>setTimeout(()=>spawnWord(w),i*430));
  for(let i=0;i<3;i++) setTimeout(spawnDust,200+i*260);
  setTimeout(()=>ceilNote.classList.add('show'),1450);
  setTimeout(()=>{ ceilNote.classList.remove('show'); thudBusy=false; },3900);
});
function spawnWord(w){
  const s=document.createElement('span');
  s.className='tw'; s.textContent=w;
  s.style.left=(16+Math.random()*52)+'%';
  s.style.top=(5+Math.random()*8)+'%';
  thuds.appendChild(s);
  setTimeout(()=>s.remove(),1450);
}
function spawnDust(){
  const d=document.createElement('span');
  d.className='dust';
  d.style.left=(44+Math.random()*10)+'%';
  d.style.top='12%';
  thuds.appendChild(d);
  setTimeout(()=>d.remove(),1200);
}

/* ============ LOGO = RITORNO ALL'ANDRONE ============ */
$('#logoBtn').addEventListener('click',()=>{
  if(busy) return;
  [liftLobby,liftLand].forEach(l=>l.classList.remove('open'));
  cabDoor.classList.remove('open');
  cab.classList.remove('run','ding');
  cabNum.textContent='0'; cabFloor=0; setPeek('lobby');
  doorA.classList.remove('open');
  landing.classList.remove('lights-off');
  fridgeWrap.classList.remove('open');
  closeCard(); hideBubble();
  btnLift.classList.remove('show');
  go('androne'); setTag('PIANO 0');
});
</script>
</body>
</html>
