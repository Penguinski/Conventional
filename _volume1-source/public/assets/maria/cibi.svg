<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720">
  <title id="rc-title">Ricettario di Maria — asset piatti</title>
  <desc id="rc-desc">Sei illustrazioni flat per il ricettario: ciambellone allo yogurt, bagna cauda, biscotti al burro, cavolfiore gratinato, fritto misto, ragù della domenica, più tre livelli di odore. Sfondo trasparente.</desc>

