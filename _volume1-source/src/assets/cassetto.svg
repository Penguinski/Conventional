<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="1160" height="520">
  <title id="mm-title">Memory del cassetto di Maria — asset</title>
  <desc id="mm-desc">Sei oggetti del cassetto (rocchetto, bottone, forbicine, spilla da balia, pila, graffetta), vecchia chiave, retro carta e variante selezionata. Stile flat coerente con l'appartamento di Maria, sfondo trasparente.</desc>

  <g stroke="#2A211C" stroke-linecap="round" stroke-linejoin="round">

    <!-- ============ ROCCHETTO DI FILO ============ -->
    <g id="memory-thread-spool" transform="translate(110,150)">
      <path d="M27,24 q32,6 28,42" fill="none" stroke-width="6"/>
      <rect x="-27" y="-38" width="54" height="76" fill="#C4674C" stroke-width="6"/>
      <path d="M-27,-14 H27 M-27,6 H27 M-27,26 H27" fill="none" stroke-width="5"/>
      <rect x="-42" y="-56" width="84" height="18" rx="6" fill="#D9A654" stroke-width="6"/>
      <rect x="-42" y="38" width="84" height="18" rx="6" fill="#D9A654" stroke-width="6"/>
    </g>

    <!-- ============ BOTTONE ============ -->
    <g id="memory-button" transform="translate(300,150)">
      <circle cx="0" cy="0" r="46" fill="#A97F8F" stroke-width="6"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke-width="5"/>
      <g stroke="none" fill="#2A211C">
        <circle cx="-12" cy="-12" r="5.5"/>
        <circle cx="12" cy="-12" r="5.5"/>
        <circle cx="-12" cy="12" r="5.5"/>
        <circle cx="12" cy="12" r="5.5"/>
      </g>
    </g>

    <!-- ============ FORBICINE ============ -->
    <g id="memory-scissors" transform="translate(490,150)">
      <path d="M-26,-56 L8,18 M26,-56 L-8,18" fill="none" stroke-width="7"/>
      <circle cx="13" cy="32" r="14" fill="none" stroke-width="7"/>
      <circle cx="-13" cy="32" r="14" fill="none" stroke-width="7"/>
      <circle cx="0" cy="0" r="5" fill="#2A211C" stroke="none"/>
    </g>

    <!-- ============ SPILLA DA BALIA ============ -->
    <g id="memory-safety-pin" transform="translate(690,150)">
      <circle cx="-38" cy="0" r="9" fill="none" stroke-width="6"/>
      <path d="M-38,-9 H28 M-38,9 H20" fill="none" stroke-width="6"/>
      <rect x="20" y="-15" width="30" height="30" rx="12" fill="#D9A654" stroke-width="6"/>
    </g>

    <!-- ============ PILA / BATTERIA ============ -->
    <g id="memory-battery" transform="translate(880,150)">
      <rect x="-9" y="-56" width="18" height="12" rx="4" fill="#D9A654" stroke-width="5"/>
      <rect x="-21" y="-46" width="42" height="92" rx="9" fill="#6E8B94" stroke-width="6"/>
      <rect x="-21" y="-8" width="42" height="22" fill="#C4674C" stroke-width="5"/>
    </g>

    <!-- ============ GRAFFETTA ============ -->
    <g id="memory-paperclip" transform="translate(1060,150)" fill="none">
      <path d="M-16,36 V-20 q0,-16 16,-16 q16,0 16,16 V32 q0,14 -14,14 q-14,0 -14,-14 V-8" stroke-width="13"/>
      <path d="M-16,36 V-20 q0,-16 16,-16 q16,0 16,16 V32 q0,14 -14,14 q-14,0 -14,-14 V-8" stroke="#D9A654" stroke-width="6"/>
    </g>

    <!-- ============ VECCHIA CHIAVE (ricompensa finale) ============ -->
    <g id="memory-key" transform="translate(140,380)">
      <rect x="24" y="8" width="11" height="18" rx="3" fill="#D9A654" stroke-width="6"/>
      <rect x="39" y="8" width="11" height="24" rx="3" fill="#D9A654" stroke-width="6"/>
      <rect x="-8" y="-8" width="56" height="16" rx="5" fill="#D9A654" stroke-width="6"/>
      <path fill-rule="evenodd" fill="#D9A654" stroke-width="6" d="M-30,-24 A24,24 0 1 0 -30,24 A24,24 0 1 0 -30,-24 Z M-30,-11 A11,11 0 1 1 -30,11 A11,11 0 1 1 -30,-11 Z"/>
    </g>

    <!-- ============ RETRO CARTA MEMORY ============ -->
    <g id="memory-card-back" transform="translate(400,380)">
      <rect x="-60" y="-80" width="120" height="160" rx="14" fill="#F4E7D3" stroke-width="6"/>
      <rect x="-46" y="-66" width="92" height="132" rx="8" fill="none" stroke="#C4674C" stroke-width="4"/>
      <path d="M0,16 q-18,-16 -9,-27 q6,-7 9,1 q3,-8 9,-1 q9,11 -9,27 Z" fill="#A97F8F" stroke-width="5"/>
      <g stroke="none" fill="#D9A654">
        <circle cx="-34" cy="-54" r="4"/>
        <circle cx="34" cy="-54" r="4"/>
        <circle cx="-34" cy="54" r="4"/>
        <circle cx="34" cy="54" r="4"/>
      </g>
    </g>

    <!-- ============ CARTA SELEZIONATA (variante leggera) ============ -->
    <g id="memory-card-selected" transform="translate(620,380)">
      <rect x="-68" y="-88" width="136" height="176" rx="18" fill="none" stroke="#C4674C" stroke-width="5"/>
      <rect x="-60" y="-80" width="120" height="160" rx="14" fill="#F4E7D3" stroke-width="6"/>
      <rect x="-46" y="-66" width="92" height="132" rx="8" fill="none" stroke="#C4674C" stroke-width="4"/>
      <path d="M0,16 q-18,-16 -9,-27 q6,-7 9,1 q3,-8 9,-1 q9,11 -9,27 Z" fill="#A97F8F" stroke-width="5"/>
      <g stroke="none" fill="#D9A654">
        <circle cx="-34" cy="-54" r="4"/>
        <circle cx="34" cy="-54" r="4"/>
        <circle cx="-34" cy="54" r="4"/>
        <circle cx="34" cy="54" r="4"/>
      </g>
    </g>

  </g>
</svg>