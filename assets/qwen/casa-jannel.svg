    <!-- ============ TAVOLO DEI TAROCCHI ============ -->
    <g id="tarot-table">
      <rect x="1096" y="576" width="14" height="164" fill="#B98A52" stroke-width="5"/>
      <rect x="1310" y="576" width="14" height="164" fill="#B98A52" stroke-width="5"/>
      <rect x="1080" y="560" width="260" height="16" rx="6" fill="#B98A52" stroke-width="5"/>
      <g id="table-runner">
        <rect x="1150" y="548" width="120" height="14" rx="4" fill="#A97F8F" stroke-width="4"/>
        <path d="M1156,562 h108 v50 q-54,10 -108,0 Z" fill="#A97F8F" stroke-width="4"/>
        <path d="M1162,606 h96" fill="none" stroke="#D9A654" stroke-width="3"/>
      </g>
      <!-- candela -->
      <g id="tarot-candle">
        <ellipse cx="1105" cy="506" rx="4" ry="7" fill="#F7D489" stroke-width="3"/>
        <rect x="1098" y="514" width="14" height="34" rx="4" fill="#F4E7D3" stroke-width="4"/>
        <rect x="1092" y="548" width="26" height="8" rx="4" fill="#D9A654" stroke-width="3"/>
      </g>
      <!-- carte aperte a ventaglio -->
      <g id="tarot-cards">
        <g transform="rotate(-14 1160 530)">
          <rect x="1143" y="504" width="34" height="52" rx="3" fill="#FBF6EA" stroke-width="4"/>
          <circle cx="1160" cy="526" r="6" fill="#A97F8F" stroke-width="3"/>
          <path d="M1160,514 v-6 M1160,544 v-6 M1148,526 h-5 M1172,526 h5" fill="none" stroke-width="2"/>
        </g>
        <rect x="1183" y="500" width="34" height="52" rx="3" fill="#FBF6EA" stroke-width="4"/>
        <path d="M1204,514 A10,10 0 1 0 1204,534 A7.5,7.5 0 1 1 1204,514 Z" fill="#D9A654" stroke-width="3"/>
        <g transform="rotate(14 1240 530)">
          <rect x="1223" y="504" width="34" height="52" rx="3" fill="#FBF6EA" stroke-width="4"/>
          <circle cx="1240" cy="528" r="7" fill="#C4674C" stroke-width="3"/>
          <path d="M1240,516 v-5 M1240,545 v-5 M1228,528 h-5 M1252,528 h5" fill="none" stroke-width="2"/>
        </g>
      </g>
      <!-- mazzo -->
      <g id="tarot-deck">
        <rect x="1272" y="542" width="44" height="14" rx="3" fill="#8C6478" stroke-width="4"/>
        <path d="M1276,542 h36" fill="none" stroke="#F4E7D3" stroke-width="3"/>
        <circle cx="1294" cy="549" r="2.5" fill="#D9A654" stroke="none"/>
      </g>
    </g>

    <!-- ============ SFERA DI CRISTALLO su sgabello ============ -->
    <g id="jannel-stool">
      <rect x="1400" y="632" width="10" height="108" fill="#B98A52" stroke-width="4"/>
      <rect x="1458" y="632" width="10" height="108" fill="#B98A52" stroke-width="4"/>
      <rect x="1392" y="620" width="84" height="12" rx="6" fill="#B98A52" stroke-width="4"/>
    </g>
    <g id="crystal-ball">
      <path d="M1416,616 q18,16 36,0" fill="none" stroke="#D9A654" stroke-width="5"/>
      <circle cx="1434" cy="592" r="26" fill="#C9DBE2" stroke-width="5"/>
      <path d="M1420,582 q6,-10 16,-12" fill="none" stroke="#F4E7D3" stroke-width="4"/>
      <path d="M1444,600 h8 M1448,596 v8" fill="none" stroke="#F4E7D3" stroke-width="3"/>
    </g>

    <!-- ============ GATTO A TERRA ============ -->
    <g id="cat-4">
      <path d="M906,706 q-14,-6 -10,-22" fill="none" stroke-width="4"/>
      <rect x="906" y="700" width="64" height="26" rx="13" fill="#C4674C" stroke-width="4"/>
      <rect x="914" y="724" width="8" height="18" rx="3" fill="#C4674C" stroke-width="3"/>
      <rect x="930" y="724" width="8" height="18" rx="3" fill="#C4674C" stroke-width="3"/>
      <rect x="948" y="724" width="8" height="18" rx="3" fill="#C4674C" stroke-width="3"/>
      <circle cx="976" cy="700" r="12" fill="#C4674C" stroke-width="4"/>
      <path d="M968,692 l-3,-9 l8,3 Z" fill="#C4674C" stroke-width="3"/>
      <path d="M982,691 l4,-9 l-8,3 Z" fill="#C4674C" stroke-width="3"/>
      <path d="M930,706 q6,6 12,0 M948,708 q6,6 12,0" fill="none" stroke="#A8563F" stroke-width="3"/>
    </g>

    <!-- ============ POLTRONA con gatto addormentato ============ -->
    <g id="jannel-armchair">
      <rect x="1576" y="660" width="16" height="82" rx="4" fill="#B98A52" stroke-width="4"/>
      <rect x="1768" y="660" width="16" height="82" rx="4" fill="#B98A52" stroke-width="4"/>
      <rect x="1592" y="440" width="200" height="170" rx="16" fill="#C4674C" stroke-width="6"/>
      <rect x="1608" y="458" width="168" height="118" rx="10" fill="none" stroke="#A8563F" stroke-width="4"/>
      <rect x="1578" y="596" width="228" height="64" rx="12" fill="#C4674C" stroke-width="6"/>
      <rect x="1560" y="540" width="42" height="120" rx="18" fill="#A8563F" stroke-width="5"/>
      <rect x="1778" y="540" width="42" height="120" rx="18" fill="#A8563F" stroke-width="5"/>
      <rect x="1620" y="540" width="80" height="60" rx="10" fill="#D9A654" stroke-width="4" transform="rotate(-4 1660 570)"/>
      <g id="cat-2">
        <path d="M1668,588 q-12,-12 4,-20" fill="none" stroke-width="4"/>
        <ellipse cx="1702" cy="584" rx="34" ry="18" fill="#D9C9B2" stroke-width="4"/>
        <circle cx="1730" cy="574" r="13" fill="#D9C9B2" stroke-width="4"/>
        <path d="M1722,566 l-3,-9 l8,3 Z" fill="#D9C9B2" stroke-width="3"/>
        <path d="M1736,565 l4,-9 l-8,3 Z" fill="#D9C9B2" stroke-width="3"/>
        <path d="M1726,576 q4,3 8,0" fill="none" stroke-width="3"/>
        <path d="M1690,576 q5,5 10,0 M1706,578 q5,5 10,0" fill="none" stroke="#B7A995" stroke-width="3"/>
      </g>
    </g>

    <!-- quadretto con gatto -->
    <g id="cat-frame">
      <rect x="1640" y="270" width="90" height="110" rx="6" fill="#F4E7D3" stroke-width="5"/>
      <rect x="1652" y="282" width="66" height="86" fill="#FBF6EA" stroke-width="3"/>
      <path d="M1685,352 q0,-18 12,-18 q12,0 12,18 Z" fill="#2A211C" stroke-width="3"/>
      <circle cx="1697" cy="330" r="7" fill="#2A211C" stroke-width="3"/>
      <path d="M1692,325 l-2,-6 l6,2 Z M1702,325 l2,-6 l-6,2 Z" fill="#2A211C" stroke-width="3"/>
      <circle cx="1672" cy="300" r="5" fill="#D9A654" stroke-width="3"/>
    </g>

    <!-- ============ LIBRERIA con pianta ricadente e gatto ============ -->
    <g id="jannel-shelf">
      <rect x="1860" y="300" width="240" height="440" rx="8" fill="#B98A52" stroke-width="6"/>
      <path d="M1876,420 H2084 M1876,540 H2084 M1876,660 H2084" fill="none" stroke-width="4"/>
      <!-- pianta ricadente in alto -->
      <g id="plant-trailing">
        <rect x="1886" y="376" width="44" height="44" rx="6" fill="#C4674C" stroke-width="4"/>
        <ellipse cx="1908" cy="368" rx="8" ry="12" fill="#7FA37A" stroke-width="3"/>
        <ellipse cx="1896" cy="374" rx="6" ry="9" fill="#7FA37A" stroke-width="3" transform="rotate(-20 1896 374)"/>
        <path d="M1888,398 C1862,440 1870,480 1858,520" fill="none" stroke="#7FA37A" stroke-width="4"/>
        <circle cx="1874" cy="440" r="6" fill="#7FA37A" stroke-width="3"/>
        <circle cx="1868" cy="482" r="6" fill="#7FA37A" stroke-width="3"/>
        <circle cx="1860" cy="516" r="6" fill="#7FA37A" stroke-width="3"/>
      </g>
      <!-- libri -->
      <rect x="1960" y="352" width="16" height="68" fill="#6E8B94" stroke-width="3" transform="rotate(-5 1968 386)"/>
      <rect x="1982" y="350" width="16" height="70" fill="#A97F8F" stroke-width="3"/>
      <rect x="2004" y="354" width="16" height="66" fill="#C4674C" stroke-width="3" transform="rotate(4 2012 387)"/>
      <!-- ripiano medio: libri impilati e vaso -->
      <rect x="1884" y="516" width="64" height="10" rx="3" fill="#6E8B94" stroke-width="3"/>
      <rect x="1888" y="504" width="58" height="10" rx="3" fill="#C4674C" stroke-width="3"/>
      <rect x="1892" y="492" width="52" height="10" rx="3" fill="#D9A654" stroke-width="3"/>
      <rect x="2000" y="496" width="36" height="44" rx="6" fill="#A97F8F" stroke-width="4"/>
      <!-- ripiano basso: cesta con lane -->
      <path d="M1900,700 h90 l-10,36 h-70 Z" fill="#C9A171" stroke-width="4"/>
      <circle cx="1922" cy="694" r="10" fill="#A97F8F" stroke-width="3"/>
      <circle cx="1946" cy="690" r="11" fill="#C4674C" stroke-width="3"/>
      <circle cx="1968" cy="696" r="9" fill="#7FA37A" stroke-width="3"/>
      <!-- gatto in cima -->
      <g id="cat-3" fill="#2A211C" stroke-width="3">
        <path d="M2054,298 q12,-4 10,-18" fill="none"/>
        <path d="M2026,300 q0,-22 14,-22 q14,0 14,22 Z"/>
        <circle cx="2040" cy="272" r="9"/>
        <path d="M2034,266 l-3,-8 l7,3 Z"/>
        <path d="M2046,266 l3,-8 l-7,3 Z"/>
      </g>
    </g>

    <!-- ============ BLEED DESTRO: pianta secondaria ============ -->
    <g id="plant-floor-right">
      <ellipse cx="2230" cy="600" rx="12" ry="20" fill="#7FA37A" stroke-width="4"/>
      <ellipse cx="2210" cy="614" rx="9" ry="15" fill="#7FA37A" stroke-width="3" transform="rotate(-18 2210 614)"/>
      <ellipse cx="2250" cy="614" rx="9" ry="15" fill="#7FA37A" stroke-width="3" transform="rotate(18 2250 614)"/>
      <path d="M2204,660 h52 l-7,62 h-38 Z" fill="#C4674C" stroke-width="5"/>
    </g>

  </g>
</svg>