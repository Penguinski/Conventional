<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 900" width="2400" height="900">
  <title id="cj-title">Casa di Jannel — Conventional Vol.1</title>
  <desc id="cj-desc">Soggiorno di Jannel: tavolo dei tarocchi con carte, mazzo e candela, sfera di cristallo su sgabello, quattro gatti, molte piante, poltrona, libreria e porta prugna. Vista frontale, sfondo trasparente, bleed laterale ampio.</desc>

  <g id="jannel-room" stroke="#2A211C" stroke-linecap="round" stroke-linejoin="round">

    <!-- ============ PARETE ============ -->
    <g id="wall">
      <rect x="0" y="0" width="2400" height="740" fill="#E6D5DE" stroke="none"/>
      <rect id="wall-dado" x="0" y="568" width="2400" height="172" fill="#A97F8F" stroke="none"/>
      <rect id="wall-rail" x="0" y="556" width="2400" height="14" fill="#F4E7D3" stroke-width="4"/>
    </g>

    <!-- ============ PAVIMENTO ============ -->
    <g id="floor">
      <rect x="0" y="740" width="2400" height="160" fill="#C89B66" stroke="none"/>
      <path d="M160,740 V900 M320,740 V900 M480,740 V900 M640,740 V900 M800,740 V900 M960,740 V900 M1120,740 V900 M1280,740 V900 M1440,740 V900 M1600,740 V900 M1760,740 V900 M1920,740 V900 M2080,740 V900 M2240,740 V900" fill="none" stroke-width="3" opacity="0.35"/>
      <path d="M0,740 H2400" fill="none" stroke-width="5"/>
    </g>

    <rect id="baseboard" x="0" y="722" width="2400" height="20" fill="#F4E7D3" stroke-width="4"/>

    <!-- tappeto sotto il nucleo centrale -->
    <g id="rug">
      <ellipse cx="1230" cy="806" rx="250" ry="34" fill="#8C6478" stroke-width="5"/>
      <ellipse cx="1230" cy="806" rx="170" ry="22" fill="none" stroke="#D9A654" stroke-width="3"/>
    </g>

    <!-- ombre morbide -->
    <g id="soft-shadows" fill="#2A211C" stroke="none" opacity="0.07">
      <ellipse cx="712" cy="752" rx="70" ry="9"/>
      <ellipse cx="940" cy="748" rx="55" ry="8"/>
      <ellipse cx="1210" cy="752" rx="150" ry="12"/>
      <ellipse cx="1434" cy="750" rx="60" ry="8"/>
      <ellipse cx="1690" cy="754" rx="140" ry="12"/>
      <ellipse cx="1980" cy="752" rx="130" ry="11"/>
    </g>

    <!-- ============ BLEED SINISTRO: mensola con pianta ricadente ============ -->
    <g id="bleed-shelf-plant">
      <rect x="150" y="260" width="140" height="12" rx="6" fill="#B98A52" stroke-width="4"/>
      <rect x="196" y="216" width="44" height="44" rx="6" fill="#C4674C" stroke-width="4"/>
      <path d="M200,238 C170,290 178,340 164,392" fill="none" stroke="#7FA37A" stroke-width="4"/>
      <circle cx="186" cy="282" r="6" fill="#7FA37A" stroke-width="3"/>
      <circle cx="176" cy="330" r="6" fill="#7FA37A" stroke-width="3"/>
      <circle cx="166" cy="378" r="6" fill="#7FA37A" stroke-width="3"/>
    </g>

    <!-- ============ PORTA D'INGRESSO ============ -->
    <g id="jannel-entry-door">
      <rect x="430" y="240" width="220" height="500" rx="6" fill="#F4E7D3" stroke-width="6"/>
      <rect x="446" y="256" width="188" height="484" fill="#A97F8F" stroke-width="5"/>
      <g fill="none" stroke="#8C6478" stroke-width="4">
        <rect x="462" y="470" width="156" height="110" rx="5"/>
        <rect x="462" y="600" width="156" height="120" rx="5"/>
      </g>
      <!-- erbette appese -->
      <g id="door-herbs">
        <circle cx="540" cy="300" r="3" fill="#2A211C" stroke="none"/>
        <path d="M540,300 V318" fill="none" stroke-width="3"/>
        <ellipse cx="532" cy="334" rx="6" ry="12" fill="#7FA37A" stroke-width="3" transform="rotate(14 532 334)"/>
        <ellipse cx="548" cy="334" rx="6" ry="12" fill="#7FA37A" stroke-width="3" transform="rotate(-14 548 334)"/>
        <ellipse cx="540" cy="338" rx="6" ry="13" fill="#7FA37A" stroke-width="3"/>
        <circle cx="540" cy="320" r="4" fill="#C4674C" stroke-width="3"/>
      </g>
      <circle cx="616" cy="500" r="6" fill="#D9A654" stroke-width="4"/>
    </g>

    <!-- ============ FINESTRA con tende terracotta ============ -->
    <g id="jannel-window">
      <rect x="760" y="200" width="240" height="220" rx="10" fill="#D9A654" stroke-width="6"/>
      <rect x="776" y="216" width="208" height="188" fill="#A9C1CE" stroke-width="4"/>
      <path d="M880,216 V404 M776,310 H984" fill="none" stroke-width="4"/>
      <path d="M776,206 H818 C826,250 810,290 820,330 C826,360 812,384 818,404 H776 Z" fill="#C4674C" stroke-width="4"/>
      <path d="M984,206 H942 C934,250 950,290 940,330 C934,360 948,384 942,404 H984 Z" fill="#C4674C" stroke-width="4"/>
      <path d="M742,206 H1018" fill="none" stroke-width="5"/>
      <circle cx="736" cy="206" r="6" fill="#B98A52" stroke-width="4"/>
      <circle cx="1024" cy="206" r="6" fill="#B98A52" stroke-width="4"/>
      <rect x="746" y="420" width="268" height="14" rx="6" fill="#F4E7D3" stroke-width="5"/>
      <!-- gatto sul davanzale -->
      <g id="cat-1" fill="#2A211C" stroke-width="3">
        <path d="M974,418 q12,-4 10,-16" fill="none"/>
        <path d="M946,420 q0,-20 14,-20 q14,0 14,20 Z"/>
        <circle cx="960" cy="394" r="8"/>
        <path d="M954,388 l-3,-8 l7,3 Z"/>
        <path d="M966,388 l3,-8 l-7,3 Z"/>
      </g>
      <!-- piantina sul davanzale -->
      <g id="plant-windowsill">
        <ellipse cx="800" cy="386" rx="6" ry="10" fill="#7FA37A" stroke-width="3"/>
        <ellipse cx="790" cy="392" rx="5" ry="8" fill="#7FA37A" stroke-width="3" transform="rotate(-20 790 392)"/>
        <ellipse cx="810" cy="392" rx="5" ry="8" fill="#7FA37A" stroke-width="3" transform="rotate(20 810 392)"/>
        <path d="M786,398 h26 l-4,22 h-18 Z" fill="#C4674C" stroke-width="3"/>
      </g>
    </g>

    <!-- ============ PIANTA GRANDE DA TERRA ============ -->
    <g id="plant-floor-left">
      <path d="M712,646 C706,600 690,580 676,562 M712,646 C712,590 712,570 712,548 M712,646 C718,600 736,584 748,566" fill="none" stroke-width="4"/>
      <g fill="#7FA37A" stroke-width="4">
        <ellipse cx="672" cy="548" rx="15" ry="24" transform="rotate(-20 672 548)"/>
        <ellipse cx="712" cy="532" rx="16" ry="26"/>
        <ellipse cx="752" cy="552" rx="15" ry="24" transform="rotate(20 752 552)"/>
        <ellipse cx="688" cy="596" rx="12" ry="18" transform="rotate(-15 688 596)"/>
        <ellipse cx="738" cy="600" rx="12" ry="18" transform="rotate(15 738 600)"/>
      </g>
      <rect x="664" y="646" width="96" height="16" rx="6" fill="#C4674C" stroke-width="5"/>
      <path d="M670,662 h84 l-10,78 h-64 Z" fill="#C4674C" stroke-width="5"/>
    </g>

    <!-- ============ APPESO LUNARE sopra il tavolo ============ -->
    <g id="moon-hanging">
      <circle cx="1210" cy="240" r="3" fill="#2A211C" stroke="none"/>
      <path d="M1210,240 V262" fill="none" stroke-width="3"/>
      <path d="M1216,262 A20,20 0 1 0 1216,302 A15,15 0 1 1 1216,262 Z" fill="#D9A654" stroke-width="4"/>
      <circle cx="1232" cy="272" r="3" fill="#F4E7D3" stroke="none"/>
      <circle cx="1226" cy="296" r="2.5" fill="#F4E7D3" stroke="none"/>
