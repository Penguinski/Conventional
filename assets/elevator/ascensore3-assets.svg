<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1080" width="2400" height="1080">
  <title id="pack-title">Conventional Vol.1 — Asset pack minigioco ascensore</title>
  <desc id="pack-desc">Foglio di asset vettoriali: cabina ascensore top-down, dieci personaggi dall'alto, slot posizione, marker TU e variante attiva, cane e gatto. Sfondo trasparente, elementi separabili.</desc>

  <g id="asset-pack" stroke="#2A211C" stroke-linecap="round" stroke-linejoin="round">

