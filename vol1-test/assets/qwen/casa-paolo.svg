<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 900" width="2400" height="900">
  <title id="cp-title">Casa di Paolo — Conventional Vol.1</title>
  <desc id="cp-desc">Camera da letto di Paolo: letto perfettamente rifatto, lampada sul comodino, armadio con libri allineati, pantofole simmetriche, soffitto ampio per i rumori dal piano di sopra. Vista frontale, sfondo trasparente, bleed laterale ampio.</desc>

  <g id="paolo-room" stroke="#2A211C" stroke-linecap="round" stroke-linejoin="round">

    <!-- ============ SOFFITTO (superficie ampia per future interazioni) ============ -->
    <g id="paolo-ceiling">
      <rect x="0" y="0" width="2400" height="190" fill="#EAE0CC" stroke="none"/>
      <rect x="0" y="178" width="2400" height="14" fill="#F4E7D3" stroke-width="4"/>
    </g>

    <!-- ============ PARETE ============ -->
    <g id="wall">
      <rect x="0" y="192" width="2400" height="548" fill="#C9D2CE" stroke="none"/>
      <rect id="wall-dado" x="0" y="568" width="2400" height="172" fill="#7A8B7F" stroke="none"/>
      <rect id="wall-rail" x="0" y="556" width="2400" height="14" fill="#F4E7D3" stroke-width="4"/>
    </g>

    <!-- ============ PAVIMENTO ============ -->
    <g id="floor">
      <rect x="0" y="740" width="2400" height="160" fill="#C89B66" stroke="none"/>
      <path d="M160,740 V900 M320,740 V900 M480,740 V900 M640,740 V900 M800,740 V900 M960,740 V900 M1120,740 V900 M1280,740 V900 M1440,740 V900 M1600,740 V900 M1760,740 V900 M1920,740 V900 M2080,740 V900 M2240,740 V900" fill="none" stroke-width="3" opacity="0.35"/>
      <path d="M0,740 H2400" fill="none" stroke-width="5"/>
    </g>

    <rect id="baseboard" x="0" y="722" width="2400" height="20" fill="#F4E7D3" stroke-width="4"/>

    <!-- ombre morbide -->
    <g id="soft-shadows" fill="#2A211C" stroke="none" opacity="0.07">
      <ellipse cx="1200" cy="752" rx="200" ry="12"/>
      <ellipse cx="870" cy="752" rx="120" ry="11"/>
      <ellipse cx="1490" cy="750" rx="85" ry="9"/>
    </g>

    <!-- ============ BLEED SINISTRO: termosifone dritto ============ -->
    <g id="radiator">
      <rect x="180" y="580" width="240" height="140" rx="10" fill="#F4E7D3" stroke-width="5"/>
      <path d="M210,580 V720 M240,580 V720 M270,580 V720 M300,580 V720 M330,580 V720 M360,580 V720 M390,580 V720" fill="none" stroke="#D9C9B2" stroke-width="4"/>
      <circle cx="410" cy="590" r="5" fill="#D9A654" stroke-width="3"/>
      <path d="M400,720 V740" fill="none" stroke-width="4"/>
    </g>

    <!-- ============ ARMADIO con libri perfettamente allineati ============ -->
    <g id="paolo-wardrobe">
      <g id="wardrobe-books">
        <rect x="800" y="266" width="18" height="46" fill="#6E8B94" stroke-width="4"/>
        <rect x="824" y="266" width="18" height="46" fill="#A97F8F" stroke-width="4"/>
        <rect x="848" y="266" width="18" height="46" fill="#D9A654" stroke-width="4"/>
        <rect x="872" y="266" width="18" height="46" fill="#7FA37A" stroke-width="4"/>
      </g>
      <rect x="752" y="312" width="236" height="12" rx="6" fill="#B98A52" stroke-width="4"/>
      <rect x="760" y="324" width="220" height="416" rx="8" fill="#B98A52" stroke-width="6"/>
      <rect x="776" y="344" width="92" height="376" rx="5" fill="#C9A171" stroke-width="4"/>
      <rect x="872" y="344" width="92" height="376" rx="5" fill="#C9A171" stroke-width="4"/>
      <rect x="856" y="512" width="8" height="40" rx="4" fill="#D9A654" stroke-width="3"/>
      <rect x="876" y="512" width="8" height="40" rx="4" fill="#D9A654" stroke-width="3"/>
      <rect x="770" y="740" width="24" height="10" fill="#B98A52" stroke-width="4"/>
      <rect x="946" y="740" width="24" height="10" fill="#B98A52" stroke-width="4"/>
    </g>

    <!-- ============ QUADRO PERFETTAMENTE CENTRATO ============ -->
    <g id="paolo-frame">
      <rect x="1140" y="300" width="120" height="90" rx="4" fill="#F4E7D3" stroke-width="5"/>
      <path d="M1164,352 H1236" fill="none" stroke-width="3"/>
      <circle cx="1200" cy="330" r="8" fill="#6E8B94" stroke-width="3"/>
    </g>

    <!-- ============ LETTO perfettamente rifatto ============ -->
    <g id="paolo-bed">
      <rect x="1040" y="470" width="320" height="120" rx="10" fill="#B98A52" stroke-width="6"/>
      <rect x="1058" y="488" width="284" height="84" rx="6" fill="none" stroke="#A87F4C" stroke-width="4"/>
      <rect x="1060" y="520" width="130" height="50" rx="10" fill="#F4E7D3" stroke-width="5"/>
      <rect x="1210" y="520" width="130" height="50" rx="10" fill="#F4E7D3" stroke-width="5"/>
      <rect x="1020" y="560" width="360" height="44" rx="8" fill="#A9C1CE" stroke-width="6"/>
      <rect x="1020" y="600" width="360" height="100" fill="#6E8B94" stroke-width="6"/>
      <path d="M1140,600 V700 M1260,600 V700" fill="none" stroke="#5E7A8A" stroke-width="3"/>
      <rect x="1040" y="700" width="320" height="44" rx="6" fill="#B98A52" stroke-width="5"/>
    </g>

    <!-- pantofole simmetriche, perfettamente parallele -->
    <g id="paolo-slippers">
      <rect x="1130" y="770" width="48" height="16" rx="8" fill="#9AA79B" stroke-width="4"/>
      <path d="M1142,778 h24" fill="none" stroke="#F4E7D3" stroke-width="3"/>
      <rect x="1226" y="770" width="48" height="16" rx="8" fill="#9AA79B" stroke-width="4"/>
      <path d="M1238,778 h24" fill="none" stroke="#F4E7D3" stroke-width="3"/>
    </g>

    <!-- ============ COMODINO + LAMPADA + SVEGLIA ============ -->
    <g id="paolo-nightstand">
      <rect x="1412" y="596" width="156" height="12" rx="6" fill="#B98A52" stroke-width="4"/>
      <rect x="1420" y="608" width="140" height="120" rx="6" fill="#B98A52" stroke-width="5"/>
      <rect x="1436" y="624" width="108" height="40" rx="4" fill="#C9A171" stroke-width="4"/>
      <circle cx="1490" cy="644" r="4" fill="#B98A52" stroke-width="3"/>
      <rect x="1436" y="672" width="108" height="40" rx="4" fill="#C9A171" stroke-width="4"/>
      <circle cx="1490" cy="692" r="4" fill="#B98A52" stroke-width="3"/>
      <rect x="1428" y="728" width="16" height="12" fill="#B98A52" stroke-width="4"/>
      <rect x="1536" y="728" width="16" height="12" fill="#B98A52" stroke-width="4"/>
    </g>
    <!-- alone di luce: separato, pronto per la versione buia -->
    <g id="lamp-light" stroke="none">
      <ellipse cx="1478" cy="515" rx="95" ry="72" fill="#F7D489" opacity="0.25"/>
      <ellipse cx="1478" cy="515" rx="55" ry="42" fill="#F7D489" opacity="0.25"/>
    </g>
    <g id="paolo-lamp">
      <circle cx="1478" cy="494" r="3" fill="#2A211C" stroke="none"/>
      <path d="M1448,540 H1508 L1500,500 H1456 Z" fill="#D9A654" stroke-width="5"/>
      <path d="M1478,586 V540" fill="none" stroke-width="4"/>
      <rect x="1460" y="586" width="36" height="10" rx="4" fill="#3B2E27" stroke-width="3"/>
    </g>
    <!-- sveglia precisa -->
    <g id="paolo-clock">
      <circle cx="1524" cy="572" r="4" fill="#C4674C" stroke-width="3"/>
      <circle cx="1548" cy="572" r="4" fill="#C4674C" stroke-width="3"/>
      <circle cx="1536" cy="584" r="12" fill="#C4674C" stroke-width="4"/>
      <circle cx="1536" cy="584" r="7" fill="#F4E7D3" stroke-width="3"/>
      <path d="M1536,584 V579 M1536,584 H1540" fill="none" stroke-width="3"/>
    </g>

    <!-- ============ PORTA D'INGRESSO ============ -->
    <g id="paolo-entry-door">
      <rect x="1700" y="240" width="220" height="500" rx="6" fill="#F4E7D3" stroke-width="6"/>
      <rect x="1716" y="256" width="188" height="484" fill="#7A8B7F" stroke-width="5"/>
      <g fill="none" stroke="#55705F" stroke-width="4">
        <rect x="1732" y="320" width="156" height="180" rx="5"/>
        <rect x="1732" y="530" width="156" height="180" rx="5"/>
      </g>
      <g id="paolo-plate">
        <rect x="1776" y="278" width="68" height="24" rx="3" fill="#F4E7D3" stroke-width="3"/>
        <path d="M1788,290 H1832" fill="none" stroke-width="3"/>
      </g>
      <circle cx="1734" cy="500" r="6" fill="#D9A654" stroke-width="4"/>
    </g>
    <!-- zerbino perfettamente dritto -->
    <g id="paolo-doormat">
      <rect x="1710" y="760" width="180" height="30" rx="4" fill="#9AA79B" stroke-width="5"/>
      <rect x="1724" y="768" width="152" height="14" rx="2" fill="none" stroke="#F4E7D3" stroke-width="3"/>
    </g>

    <!-- ============ BLEED DESTRO: portaombrelli con un solo ombrello ============ -->
    <g id="umbrella-stand">
      <path d="M2168,560 q0,-14 12,-14" fill="none" stroke-width="4"/>
      <path d="M2162,560 C2158,590 2158,620 2162,648 H2174 C2178,620 2178,590 2174,560 Z" fill="#C4674C" stroke-width="4"/>
      <rect x="2140" y="640" width="56" height="100" rx="8" fill="#7A8B7F" stroke-width="5"/>
    </g>

  </g>
</svg>
