<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 900" width="2400" height="900">
  <title id="ca-title">Casa di Arturo — Conventional Vol.1</title>
  <desc id="ca-desc">Soggiorno di Arturo: mobile basso con televisore e Roomba incastrato sotto, poltrona con ciabatte pelose, Ugo addormentato sul cuscino, tavolino con tazza e giornale, mazza da golf appoggiata, vestaglia appesa accanto alla porta con spioncino. Vista frontale, sfondo trasparente, bleed laterale ampio.</desc>

  <g id="arturo-room" stroke="#2A211C" stroke-linecap="round" stroke-linejoin="round">

    <!-- ============ PARETE ============ -->
    <g id="wall">
      <rect x="0" y="0" width="2400" height="740" fill="#E9E1D1" stroke="none"/>
      <rect id="wall-dado" x="0" y="568" width="2400" height="172" fill="#9AA79B" stroke="none"/>
      <rect id="wall-rail" x="0" y="556" width="2400" height="14" fill="#F4E7D3" stroke-width="4"/>
    </g>

    <!-- ============ PAVIMENTO ============ -->
    <g id="floor">
      <rect x="0" y="740" width="2400" height="160" fill="#C89B66" stroke="none"/>
      <path d="M160,740 V900 M320,740 V900 M480,740 V900 M640,740 V900 M800,740 V900 M960,740 V900 M1120,740 V900 M1280,740 V900 M1440,740 V900 M1600,740 V900 M1760,740 V900 M1920,740 V900 M2080,740 V900 M2240,740 V900" fill="none" stroke-width="3" opacity="0.35"/>
      <path d="M0,740 H2400" fill="none" stroke-width="5"/>
    </g>

    <rect id="baseboard" x="0" y="722" width="2400" height="20" fill="#F4E7D3" stroke-width="4"/>

    <!-- ombre morbide: tengono i mobili a terra -->
    <g id="soft-shadows" fill="#2A211C" stroke="none" opacity="0.07">
      <ellipse cx="700" cy="752" rx="195" ry="12"/>
      <ellipse cx="940" cy="750" rx="78" ry="9"/>
      <ellipse cx="1170" cy="754" rx="150" ry="12"/>
      <ellipse cx="1405" cy="750" rx="90" ry="9"/>
    </g>

    <!-- ============ BLEED SINISTRO: finestra con tapparella chiusa ============ -->
    <g id="arturo-window">
      <rect x="160" y="200" width="240" height="220" rx="10" fill="#D9C9B2" stroke-width="6"/>
      <rect x="176" y="216" width="208" height="188" fill="#6E8B78" stroke-width="4"/>
      <path d="M176,232 H384 M176,248 H384 M176,264 H384 M176,280 H384 M176,296 H384 M176,312 H384 M176,328 H384 M176,344 H384 M176,360 H384 M176,376 H384 M176,392 H384" fill="none" stroke-width="3"/>
      <rect x="146" y="420" width="268" height="14" rx="6" fill="#F4E7D3" stroke-width="5"/>
    </g>

    <!-- ============ MOBILE BASSO con TV ============ -->
    <g id="arturo-sideboard">
      <rect x="536" y="710" width="18" height="30" fill="#B98A52" stroke-width="4"/>
      <rect x="846" y="710" width="18" height="30" fill="#B98A52" stroke-width="4"/>
      <rect x="520" y="560" width="360" height="150" rx="8" fill="#B98A52" stroke-width="6"/>
      <rect x="510" y="550" width="380" height="14" rx="6" fill="#B98A52" stroke-width="5"/>
      <rect x="538" y="578" width="150" height="114" rx="5" fill="#C9A171" stroke-width="4"/>
      <rect x="692" y="578" width="150" height="114" rx="5" fill="#C9A171" stroke-width="4"/>
      <circle cx="680" cy="635" r="5" fill="#B98A52" stroke-width="3"/>
      <circle cx="700" cy="635" r="5" fill="#B98A52" stroke-width="3"/>
      <!-- televisore vecchio appoggiato sul piano -->
      <g id="arturo-tv">
        <path d="M640,440 L620,404 M668,440 L690,408" fill="none" stroke-width="4"/>
        <rect x="600" y="440" width="150" height="110" rx="8" fill="#7A8B7F" stroke-width="5"/>
        <rect x="614" y="454" width="96" height="82" rx="6" fill="#A9C1CE" stroke-width="4"/>
        <path d="M630,522 L686,470" fill="none" stroke="#F4E7D3" stroke-width="4" opacity="0.6"/>
        <circle cx="730" cy="470" r="5" fill="#D9A654" stroke-width="3"/>
        <circle cx="730" cy="492" r="5" fill="#D9A654" stroke-width="3"/>
        <path d="M722,516 H738 M722,526 H738" fill="none" stroke-width="3"/>
      </g>
      <!-- giornale piegato sul piano -->
      <g id="arturo-folded-paper" transform="rotate(-1 815 543)">
        <rect x="780" y="536" width="70" height="14" rx="3" fill="#FBF6EA" stroke-width="4"/>
        <path d="M790,543 H840" fill="none" stroke-width="3"/>
      </g>
    </g>

    <!-- ============ ROOMBA INCASTRATO sotto il mobile ============ -->
    <g id="stuck-roomba" transform="rotate(-7 520 728)">
      <rect x="470" y="714" width="100" height="26" rx="13" fill="#3B2E27" stroke-width="4"/>
      <path d="M482,722 h76" fill="none" stroke="#9AA79B" stroke-width="3"/>
      <circle cx="520" cy="728" r="4" fill="#D9A654" stroke-width="3"/>
      <path d="M460,712 q-6,8 0,16" fill="none" stroke-width="3" opacity="0.6"/>
    </g>

    <!-- ============ UGO SUL CUSCINO ============ -->
    <g id="ugo-cushion">
      <ellipse cx="940" cy="724" rx="70" ry="20" fill="#A97F8F" stroke-width="5"/>
      <ellipse cx="940" cy="720" rx="45" ry="11" fill="none" stroke="#F4E7D3" stroke-width="3"/>
    </g>
    <g id="ugo-dog">
      <path d="M906,700 q-14,-9 -4,-21" fill="none" stroke-width="5"/>
      <ellipse cx="940" cy="700" rx="40" ry="22" fill="#C9A171" stroke-width="5"/>
      <circle cx="966" cy="690" r="15" fill="#C9A171" stroke-width="5"/>
      <path d="M973,678 q14,4 11,19 q-8,5 -13,-1 Z" fill="#B98A52" stroke-width="4"/>
      <ellipse cx="976" cy="696" rx="7" ry="6" fill="#D9C9B2" stroke-width="3"/>
      <circle cx="981" cy="694" r="2" fill="#2A211C" stroke="none"/>
      <path d="M960,688 q4,3 8,0" fill="none" stroke-width="3"/>
      <circle cx="952" cy="678" r="2" fill="#D9C9B2" stroke="none"/>
    </g>

    <!-- ============ POLTRONA ============ -->
    <g id="arturo-armchair">
      <rect x="1044" y="660" width="16" height="82" rx="4" fill="#B98A52" stroke-width="4"/>
      <rect x="1280" y="660" width="16" height="82" rx="4" fill="#B98A52" stroke-width="4"/>
      <rect x="1060" y="440" width="220" height="170" rx="16" fill="#6E8B94" stroke-width="6"/>
      <rect x="1078" y="458" width="184" height="120" rx="10" fill="none" stroke="#5E7A8A" stroke-width="4"/>
      <rect x="1046" y="596" width="248" height="64" rx="12" fill="#6E8B94" stroke-width="6"/>
      <rect x="1030" y="540" width="44" height="120" rx="18" fill="#5E7A8A" stroke-width="5"/>
      <rect x="1266" y="540" width="44" height="120" rx="18" fill="#5E7A8A" stroke-width="5"/>
    </g>

    <!-- quadro anonimo sopra la poltrona -->
    <g id="anonymous-frame">
      <rect x="1090" y="250" width="120" height="90" rx="4" fill="#D9C9B2" stroke-width="5"/>
      <rect x="1102" y="262" width="96" height="66" fill="#E9E1D1" stroke-width="3"/>
      <path d="M1114,300 H1186" fill="none" stroke="#B7A995" stroke-width="3"/>
    </g>

    <!-- ============ CIABATTE PELOSE ============ -->
    <g id="arturo-slippers">
      <g transform="rotate(-3 1127 789)">
        <rect x="1100" y="780" width="54" height="18" rx="9" fill="#55705F" stroke-width="4"/>
        <path d="M1108,782 q5,-9 10,0 q5,-9 10,0 q5,-9 10,0 q5,-9 10,0" fill="none" stroke="#7FA37A" stroke-width="5"/>
      </g>
      <g transform="rotate(4 1187 795)">
        <rect x="1160" y="786" width="54" height="18" rx="9" fill="#55705F" stroke-width="4"/>
        <path d="M1168,788 q5,-9 10,0 q5,-9 10,0 q5,-9 10,0 q5,-9 10,0" fill="none" stroke="#7FA37A" stroke-width="5"/>
      </g>
    </g>

    <!-- ============ TAVOLINO con tazza e giornale ============ -->
    <g id="arturo-side-table">
      <rect x="1342" y="614" width="12" height="126" fill="#B98A52" stroke-width="5"/>
      <rect x="1456" y="614" width="12" height="126" fill="#B98A52" stroke-width="5"/>
      <path d="M1348,700 H1462" fill="none" stroke-width="4"/>
      <rect x="1330" y="600" width="150" height="14" rx="6" fill="#B98A52" stroke-width="5"/>
    </g>
    <g id="arturo-tea-cup">
      <path d="M1364,562 q4,-8 0,-14" fill="none" stroke-width="3" opacity="0.6"/>
      <rect x="1352" y="580" width="26" height="20" rx="6" fill="#F4E7D3" stroke-width="4"/>
      <path d="M1378,584 q10,6 0,12" fill="none" stroke-width="4"/>
    </g>
    <g id="arturo-newspaper" transform="rotate(-2 1428 594)">
      <rect x="1392" y="586" width="72" height="16" rx="3" fill="#FBF6EA" stroke-width="4"/>
      <path d="M1428,586 V602" fill="none" stroke-width="3"/>
      <path d="M1400,594 H1420 M1436,594 H1456" fill="none" stroke-width="3"/>
    </g>

    <!-- ============ MAZZA DA GOLF appoggiata al tavolino ============ -->
    <g id="golf-club">
      <path d="M1512,742 L1488,566" fill="none" stroke-width="5"/>
      <path d="M1488,566 L1484,540" fill="none" stroke-width="7"/>
      <path d="M1512,742 q-20,4 -24,-8 q10,-9 24,-4 Z" fill="#9AA79B" stroke-width="4"/>
      <circle cx="1560" cy="760" r="6" fill="#F4E7D3" stroke-width="3"/>
    </g>

    <!-- ============ VESTAGLIA appesa vicino alla porta ============ -->
    <g id="arturo-robe">
      <circle cx="1620" cy="470" r="4" fill="#2A211C" stroke="none"/>
      <path d="M1620,474 q-14,10 -16,26 M1620,474 q14,10 16,26" fill="none" stroke-width="4"/>
      <path d="M1604,505 C1592,540 1594,566 1600,584 q8,6 14,0 C1610,560 1608,530 1612,508 Z" fill="#D9C9B2" stroke-width="4"/>
      <path d="M1604,498 h32 l14,150 q-30,12 -60,0 Z" fill="#D9C9B2" stroke-width="5"/>
      <path d="M1608,500 l12,30 l12,-30" fill="none" stroke-width="4"/>
      <path d="M1600,560 h40" fill="none" stroke-width="4"/>
      <path d="M1618,560 l-4,26 M1622,560 l6,24" fill="none" stroke-width="4"/>
    </g>

    <!-- ============ PORTA D'INGRESSO con spioncino ============ -->
    <g id="arturo-entry-door">
      <rect x="1700" y="240" width="220" height="500" rx="6" fill="#F4E7D3" stroke-width="6"/>
      <rect x="1716" y="256" width="188" height="484" fill="#9AA79B" stroke-width="5"/>
      <g fill="none" stroke="#6F7F78" stroke-width="4">
        <rect x="1732" y="470" width="156" height="110" rx="5"/>
        <rect x="1732" y="600" width="156" height="120" rx="5"/>
      </g>
      <g id="arturo-plate">
        <rect x="1788" y="282" width="44" height="16" rx="2" fill="#F4E7D3" stroke-width="3"/>
      </g>
      <g id="peephole">
        <circle cx="1810" cy="340" r="11" fill="none" stroke-width="4"/>
        <circle cx="1810" cy="340" r="7" fill="#3B2E27" stroke-width="4"/>
        <circle cx="1808" cy="338" r="2" fill="#9AA79B" stroke="none"/>
      </g>
      <g id="door-chain">
        <rect x="1724" y="424" width="10" height="26" rx="4" fill="#D9A654" stroke-width="3"/>
        <rect x="1742" y="432" width="24" height="10" rx="4" fill="#D9A654" stroke-width="3"/>
      </g>
      <circle cx="1734" cy="500" r="6" fill="#D9A654" stroke-width="4"/>
    </g>
    <g id="arturo-doormat">
      <rect x="1710" y="760" width="180" height="30" rx="4" fill="#B7A995" stroke-width="5"/>
    </g>

  </g>
</svg>