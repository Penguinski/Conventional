<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title id="fc-title">Facciata condominio — Conventional Vol.1</title>
  <desc id="fc-desc">Facciata frontale illustrata: piano terra con portone, citofono e N°12; tre piani con sei finestre (player, Maria, Paolo, Rossi, Arturo, Jannel). Sfondo trasparente.</desc>

  <g id="building" stroke="#2A211C" stroke-linecap="round" stroke-linejoin="round">

    <!-- ============ STRUTTURA ============ -->
    <g id="structure">
      <!-- comignoli -->
      <g id="chimneys">
        <rect x="420" y="40" width="48" height="40" fill="#C98A6E" stroke-width="5"/>
        <rect x="412" y="30" width="64" height="12" rx="4" fill="#F4E7D3" stroke-width="4"/>
        <rect x="1096" y="26" width="48" height="54" fill="#C98A6E" stroke-width="5"/>
        <rect x="1088" y="16" width="64" height="12" rx="4" fill="#F4E7D3" stroke-width="4"/>
      </g>
      <!-- cornice di coronamento -->
      <rect id="cornice" x="300" y="78" width="1000" height="40" rx="4" fill="#3B2E27" stroke-width="5"/>
      <!-- muro principale -->
      <rect id="facade" x="320" y="118" width="960" height="962" fill="#E2B49E" stroke-width="6"/>
      <!-- fasce marcapiano -->
      <g id="floor-bands" fill="#F4E7D3" stroke-width="4">
        <rect x="320" y="352" width="960" height="12"/>
        <rect x="320" y="586" width="960" height="12"/>
        <rect x="320" y="820" width="960" height="12"/>
      </g>
      <!-- zoccolo -->
      <rect id="plinth" x="320" y="1042" width="960" height="38" fill="#B7A995" stroke-width="5"/>
      <!-- pluviale -->
      <g id="downpipe">
        <rect x="1246" y="118" width="16" height="962" fill="#9AA79B" stroke-width="4"/>
        <rect x="1240" y="118" width="28" height="16" rx="3" fill="#9AA79B" stroke-width="4"/>
        <rect x="1242" y="320" width="24" height="6" fill="#2A211C" stroke="none"/>
        <rect x="1242" y="640" width="24" height="6" fill="#2A211C" stroke="none"/>
        <rect x="1242" y="960" width="24" height="6" fill="#2A211C" stroke="none"/>
      </g>
    </g>

    <!-- ============ PIANO TERRA ============ -->
    <g id="ground-floor">

      <!-- finestrella grigliata sinistra -->
      <g id="ground-window-left">
        <rect x="495" y="880" width="140" height="120" rx="6" fill="#F4E7D3" stroke-width="5"/>
        <rect x="507" y="892" width="116" height="96" fill="#A9C1CE" stroke-width="4"/>
        <path d="M546,892 V988 M584,892 V988" fill="none" stroke-width="4"/>
        <rect x="483" y="1000" width="164" height="14" rx="6" fill="#F4E7D3" stroke-width="5"/>
      </g>

      <!-- finestrella grigliata destra -->
      <g id="ground-window-right">
        <rect x="965" y="880" width="140" height="120" rx="6" fill="#F4E7D3" stroke-width="5"/>
        <rect x="977" y="892" width="116" height="96" fill="#A9C1CE" stroke-width="4"/>
        <path d="M1016,892 V988 M1054,892 V988" fill="none" stroke-width="4"/>
        <rect x="953" y="1000" width="164" height="14" rx="6" fill="#F4E7D3" stroke-width="5"/>
      </g>

      <!-- targhetta numero civico -->
      <g id="house-number">
        <rect x="640" y="846" width="60" height="32" rx="6" fill="#D9A654" stroke-width="4"/>
        <text x="670" y="868" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#2A211C" stroke="none">N°12</text>
      </g>

      <!-- portone principale -->
      <g id="entrance-door">
        <!-- tettuccio -->
        <g id="door-canopy">
          <path d="M686,812 L702,778 H898 L914,812 Z" fill="#C4674C" stroke-width="5"/>
          <rect x="686" y="806" width="228" height="10" rx="4" fill="#F4E7D3" stroke-width="4"/>
        </g>
        <!-- cornice del portone -->
        <rect x="700" y="810" width="200" height="270" rx="6" fill="#F4E7D3" stroke-width="6"/>
        <!-- sopraluce -->
        <rect id="door-transom" x="715" y="825" width="170" height="40" fill="#A9C1CE" stroke-width="4"/>
        <path d="M772,825 V865 M828,825 V865" fill="none" stroke-width="4"/>
        <!-- ante -->
        <g id="door-leaves">
          <rect x="715" y="875" width="82" height="205" fill="#4E6B5C" stroke-width="5"/>
          <rect x="803" y="875" width="82" height="205" fill="#4E6B5C" stroke-width="5"/>
          <g fill="none" stroke="#3E574B" stroke-width="4">
            <rect x="727" y="893" width="58" height="70" rx="5"/>
            <rect x="727" y="978" width="58" height="82" rx="5"/>
            <rect x="815" y="893" width="58" height="70" rx="5"/>
            <rect x="815" y="978" width="58" height="82" rx="5"/>
          </g>
          <circle cx="791" cy="960" r="5" fill="#D9A654" stroke-width="4"/>
          <circle cx="809" cy="960" r="5" fill="#D9A654" stroke-width="4"/>
        </g>
      </g>

      <!-- citofono -->
      <g id="intercom">
        <rect x="915" y="930" width="44" height="74" rx="8" fill="#F4E7D3" stroke-width="5"/>
        <rect x="923" y="940" width="28" height="12" rx="3" fill="#D9C9B2" stroke-width="3"/>
        <g fill="#C4674C" stroke-width="3">
          <circle cx="931" cy="966" r="4"/>
          <circle cx="947" cy="966" r="4"/>
          <circle cx="931" cy="982" r="4"/>
          <circle cx="947" cy="982" r="4"/>
        </g>
        <path d="M925,996 H949" fill="none" stroke-width="3"/>
      </g>
    </g>

    <!-- ============ PIANO 1 ============ -->
    <g id="floor-1">

      <!-- casa nostra / player: trasloco in corso -->
      <g id="window-player" transform="translate(465,620)">
        <rect x="-12" y="170" width="224" height="16" rx="6" fill="#F4E7D3" stroke-width="5"/>
        <rect x="0" y="0" width="200" height="170" rx="8" fill="#F4E7D3" stroke-width="5"/>
        <rect id="window-player-glass" x="16" y="16" width="168" height="138" fill="#A9C1CE" stroke-width="4"/>
        <rect id="window-player-light" x="16" y="16" width="168" height="138" fill="#F7D489" stroke="none" opacity="0"/>
        <path d="M100,16 V154 M16,85 H184" fill="none" stroke-width="4"/>
        <g id="window-player-props-inside">
          <g transform="rotate(-2 128 129)">
            <rect x="98" y="104" width="60" height="50" rx="3" fill="#C9A171" stroke-width="4"/>
            <path d="M128,104 V154" fill="none" stroke="#F4E7D3" stroke-width="3"/>
          </g>
          <g transform="rotate(3 71 138)">
            <rect x="50" y="122" width="42" height="32" rx="3" fill="#B98A52" stroke-width="4"/>
            <path d="M71,122 V154" fill="none" stroke="#F4E7D3" stroke-width="3"/>
          </g>
        </g>
        <g id="window-player-curtain"><!-- vuoto: appena trasferiti --></g>
        <g id="window-player-shutter">
          <rect x="16" y="16" width="168" height="16" fill="#6E8B78" stroke-width="4"/>
          <rect x="16" y="26" width="168" height="6" fill="#55705F" stroke-width="3"/>
        </g>
        <g id="window-player-props-sill"></g>
      </g>

      <!-- Maria: tendina tradizionale + pianta -->
      <g id="window-maria" transform="translate(935,620)">
        <rect x="-12" y="170" width="224" height="16" rx="6" fill="#F4E7D3" stroke-width="5"/>
        <rect x="0" y="0" width="200" height="170" rx="8" fill="#F4E7D3" stroke-width="5"/>
        <rect id="window-maria-glass" x="16" y="16" width="168" height="138" fill="#A9C1CE" stroke-width="4"/>
        <rect id="window-maria-light" x="16" y="16" width="168" height="138" fill="#F7D489" stroke="none" opacity="0"/>
        <path d="M100,16 V154 M16,85 H184" fill="none" stroke-width="4"/>
        <g id="window-maria-props-inside"></g>
        <g id="window-maria-curtain">
          <path d="M16,16 H184 V32 Q170,44 156,32 Q142,44 128,32 Q114,44 100,32 Q86,44 72,32 Q58,44 44,32 Q30,44 16,32 Z" fill="#F4E7D3" stroke-width="4"/>
        </g>
        <g id="window-maria-shutter">
          <rect x="16" y="16" width="168" height="16" fill="#6E8B78" stroke-width="4"/>
          <rect x="16" y="26" width="168" height="6" fill="#55705F" stroke-width="3"/>
        </g>
        <g id="window-maria-props-sill">
          <g transform="rotate(-2 42 160)">
            <ellipse cx="42" cy="138" rx="6" ry="10" fill="#7FA37A" stroke-width="3"/>
            <ellipse cx="33" cy="142" rx="5" ry="8" fill="#7FA37A" stroke-width="3" transform="rotate(-25 33 142)"/>
            <ellipse cx="51" cy="142" rx="5" ry="8" fill="#7FA37A" stroke-width="3" transform="rotate(25 51 142)"/>
            <path d="M30,150 H54 L50,170 H34 Z" fill="#C4674C" stroke-width="4"/>
          </g>
        </g>
      </g>
    </g>

    <!-- ============ PIANO 2 ============ -->
    <g id="floor-2">

      <!-- Paolo: tutto perfettamente simmetrico, tapparella a metà -->
      <g id="window-paolo" transform="translate(465,386)">
        <rect x="-12" y="170" width="224" height="16" rx="6" fill="#F4E7D3" stroke-width="5"/>
        <rect x="0" y="0" width="200" height="170" rx="8" fill="#F4E7D3" stroke-width="5"/>
        <rect id="window-paolo-glass" x="16" y="16" width="168" height="138" fill="#A9C1CE" stroke-width="4"/>
        <rect id="window-paolo-light" x="16" y="16" width="168" height="138" fill="#F7D489" stroke="none" opacity="0"/>
        <path d="M100,16 V154 M16,85 H184" fill="none" stroke-width="4"/>
        <g id="window-paolo-props-inside"></g>
        <g id="window-paolo-curtain"></g>
        <g id="window-paolo-shutter">
          <rect x="16" y="16" width="168" height="71" fill="#6E8B78" stroke-width="4"/>
          <path d="M16,28 H184 M16,40 H184 M16,52 H184 M16,64 H184 M16,76 H184" fill="none" stroke-width="3"/>
          <rect x="16" y="81" width="168" height="6" fill="#55705F" stroke-width="3"/>
        </g>
        <g id="window-paolo-props-sill">
          <circle cx="100" cy="148" r="7" fill="#7FA37A" stroke-width="3"/>
          <rect x="91" y="156" width="18" height="14" rx="2" fill="#7A8B7F" stroke-width="3"/>
        </g>
      </g>

      <!-- Famiglia Rossi: disegno taped + pallone, tenda storta -->
      <g id="window-rossi" transform="translate(935,386)">
        <rect x="-12" y="170" width="224" height="16" rx="6" fill="#F4E7D3" stroke-width="5"/>
        <rect x="0" y="0" width="200" height="170" rx="8" fill="#F4E7D3" stroke-width="5"/>
        <rect id="window-rossi-glass" x="16" y="16" width="168" height="138" fill="#A9C1CE" stroke-width="4"/>
        <rect id="window-rossi-light" x="16" y="16" width="168" height="138" fill="#F7D489" stroke="none" opacity="0"/>
        <path d="M100,16 V154 M16,85 H184" fill="none" stroke-width="4"/>
        <g id="window-rossi-props-inside">
          <g transform="rotate(-4 131 76)">
            <rect x="108" y="58" width="46" height="36" rx="2" fill="#FBF6EA" stroke-width="3"/>
            <circle cx="143" cy="67" r="4" fill="#D9A654" stroke-width="3"/>
            <path d="M115,86 Q121,76 127,86 T139,86" fill="none" stroke-width="3"/>
          </g>
        </g>
        <g id="window-rossi-curtain">
          <path d="M16,16 H64 C58,60 58,110 66,154 H16 Z" fill="#D9A654" stroke-width="4" transform="rotate(1.5 40 85)"/>
        </g>
        <g id="window-rossi-shutter">
          <rect x="16" y="16" width="168" height="16" fill="#6E8B78" stroke-width="4"/>
          <rect x="16" y="26" width="168" height="6" fill="#55705F" stroke-width="3"/>
        </g>
        <g id="window-rossi-props-sill">
          <circle cx="52" cy="161" r="9" fill="#C4674C" stroke-width="4"/>
          <path d="M46,158 Q52,154 58,158" fill="none" stroke="#F4E7D3" stroke-width="3"/>
        </g>
      </g>
    </g>

    <!-- ============ PIANO 3 ============ -->
    <g id="floor-3">

      <!-- Arturo: quasi illeggibile, tapparella quasi chiusa -->
      <g id="window-arturo" transform="translate(465,152)">
        <rect x="-12" y="170" width="224" height="16" rx="6" fill="#F4E7D3" stroke-width="5"/>
        <rect x="0" y="0" width="200" height="170" rx="8" fill="#F4E7D3" stroke-width="5"/>
        <rect id="window-arturo-glass" x="16" y="16" width="168" height="138" fill="#A9C1CE" stroke-width="4"/>
        <rect id="window-arturo-light" x="16" y="16" width="168" height="138" fill="#F7D489" stroke="none" opacity="0"/>
        <path d="M100,16 V154 M16,85 H184" fill="none" stroke-width="4"/>
        <g id="window-arturo-props-inside"></g>
        <g id="window-arturo-curtain"></g>
        <g id="window-arturo-shutter">
          <rect x="16" y="16" width="168" height="124" fill="#5C6B60" stroke-width="4"/>
          <path d="M16,28 H184 M16,40 H184 M16,52 H184 M16,64 H184 M16,76 H184 M16,88 H184 M16,100 H184 M16,112 H184 M16,124 H184" fill="none" stroke-width="3"/>
          <rect x="16" y="134" width="168" height="6" fill="#48544B" stroke-width="3"/>
        </g>
        <g id="window-arturo-props-sill"></g>
      </g>

      <!-- Jannel: piante, tenda eccentrica, gatta sul davanzale -->
      <g id="window-jannel" transform="translate(935,152)">
        <rect x="-12" y="170" width="224" height="16" rx="6" fill="#F4E7D3" stroke-width="5"/>
        <rect x="0" y="0" width="200" height="170" rx="8" fill="#F4E7D3" stroke-width="5"/>
        <rect id="window-jannel-glass" x="16" y="16" width="168" height="138" fill="#A9C1CE" stroke-width="4"/>
        <rect id="window-jannel-light" x="16" y="16" width="168" height="138" fill="#F7D489" stroke="none" opacity="0"/>
        <path d="M100,16 V154 M16,85 H184" fill="none" stroke-width="4"/>
        <g id="window-jannel-props-inside">
          <path d="M182,18 Q168,26 170,40" fill="none" stroke-width="3"/>
          <ellipse cx="170" cy="42" rx="4" ry="6" fill="#7FA37A" stroke-width="3"/>
          <ellipse cx="177" cy="30" rx="4" ry="6" fill="#7FA37A" stroke-width="3"/>
        </g>
        <g id="window-jannel-curtain">
          <path d="M16,16 H58 C66,50 52,80 62,110 C68,132 56,146 60,154 H16 Z" fill="#C4674C" stroke-width="4"/>
          <path d="M184,16 H142 C134,50 148,80 138,110 C132,132 144,146 140,154 H184 Z" fill="#C4674C" stroke-width="4"/>
        </g>
        <g id="window-jannel-shutter">
          <rect x="16" y="16" width="168" height="16" fill="#6E8B78" stroke-width="4"/>
          <rect x="16" y="26" width="168" height="6" fill="#55705F" stroke-width="3"/>
        </g>
        <g id="window-jannel-props-sill">
          <ellipse cx="43" cy="130" rx="7" ry="11" fill="#7FA37A" stroke-width="3"/>
          <ellipse cx="32" cy="136" rx="5" ry="9" fill="#7FA37A" stroke-width="3" transform="rotate(-25 32 136)"/>
          <ellipse cx="54" cy="136" rx="5" ry="9" fill="#7FA37A" stroke-width="3" transform="rotate(25 54 136)"/>
          <path d="M28,146 H58 L53,170 H33 Z" fill="#C4674C" stroke-width="4"/>
          <!-- gatta -->
          <g id="jannel-cat" fill="#2A211C" stroke-width="3">
            <path d="M160,168 Q170,164 168,152" fill="none"/>
            <path d="M136,170 Q136,150 148,150 Q160,150 160,170 Z"/>
            <circle cx="148" cy="145" r="7"/>
            <path d="M142,140 L140,132 L147,136 Z"/>
            <path d="M154,140 L156,132 L149,136 Z"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
